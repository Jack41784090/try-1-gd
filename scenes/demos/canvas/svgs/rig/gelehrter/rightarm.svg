  <path d="M36 10 Q40 60 34 100" fill="none" stroke="#1e0a10" stroke-width="1" opacity="0.3"/>
  <path d="M26 20 Q30 60 24 100" fill="none" stroke="#1e0a10" stroke-width="0.8" opacity="0.25"/>
  <!-- Arcane symbols -->
  <circle cx="28" cy="36" r="7" fill="none" stroke="#6a3050" stroke-width="0.8" opacity="0.3"/>
  <line x1="21" y1="36" x2="35" y2="36" stroke="#6a3050" stroke-width="0.5" opacity="0.25"/>
  <line x1="28" y1="29" x2="28" y2="43" stroke="#6a3050" stroke-width="0.5" opacity="0.25"/>
  <circle cx="30" cy="76" r="5" fill="none" stroke="#5a3850" stroke-width="0.6" opacity="0.25"/>
  <polygon points="30,71 34,79 26,79" fill="none" stroke="#5a3850" stroke-width="0.5" opacity="0.2"/>
