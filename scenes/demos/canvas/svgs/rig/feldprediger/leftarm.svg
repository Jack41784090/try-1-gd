<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 144" width="56" height="144">
  <defs>
    <linearGradient id="sleeveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18102a"/>
      <stop offset="40%" stop-color="#241838"/>
      <stop offset="100%" stop-color="#140e22"/>
    </linearGradient>
    <pattern id="sleeveCrossHatch" patternUnits="userSpaceOnUse" width="6" height="6">
      <line x1="0" y1="0" x2="6" y2="6" stroke="#0a0a0a" stroke-width="0.4" opacity="0.18"/>
      <line x1="6" y1="0" x2="0" y2="6" stroke="#0a0a0a" stroke-width="0.3" opacity="0.1"/>
    </pattern>
  </defs>
  <!-- Wide vestment sleeve -->
  <path d="M8 4 Q28 0 48 4 Q54 20 52 60 Q50 100 48 130 Q40 140 28 142 Q16 140 10 130 Q8 100 6 60 Q4 20 8 4 Z" fill="url(#sleeveGrad)" stroke="#0a0a0a" stroke-width="2.5"/>
  <!-- Cross-hatch fabric texture -->
  <path d="M8 4 Q28 0 48 4 Q54 20 52 60 Q50 100 48 130 Q40 140 28 142 Q16 140 10 130 Q8 100 6 60 Q4 20 8 4 Z" fill="url(#sleeveCrossHatch)"/>
  <!-- Padded armor bulge underneath -->
  <ellipse cx="20" cy="40" rx="10" ry="20" fill="#2a1828" opacity="0.3"/>
  <path d="M14 24 Q12 40 14 56" stroke="#3a2830" stroke-width="2" fill="none" opacity="0.3"/>
  <!-- Deep fabric folds -->
  <path d="M20 10 Q18 50 20 100 Q20 120 22 138" stroke="#0a0a0a" stroke-width="1.2" fill="none" opacity="0.25"/>
  <path d="M36 10 Q38 50 36 100 Q36 120 34 138" stroke="#0a0a0a" stroke-width="1" fill="none" opacity="0.2"/>
  <!-- Fold shadow -->
  <path d="M14 20 Q12 60 14 100 Q14 120 16 136" stroke="#10081a" stroke-width="3" fill="none" opacity="0.12"/>
  <!-- Gold embroidered border at cuff -->
  <path d="M10 128 Q28 134 46 128" stroke="#9a8030" stroke-width="3" fill="none"/>
  <path d="M12 132 Q28 138 44 132" stroke="#807020" stroke-width="1.5" fill="none" stroke-dasharray="3,2"/>
  <!-- Gold cuff detail dots -->
  <circle cx="18" cy="130" r="1.2" fill="#b09040" opacity="0.7"/>
  <circle cx="28" cy="132" r="1.2" fill="#b09040" opacity="0.7"/>
  <circle cx="38" cy="130" r="1.2" fill="#b09040" opacity="0.7"/>
  <!-- Embroidered cross on upper arm -->
  <line x1="28" y1="20" x2="28" y2="36" stroke="#9a8030" stroke-width="1.5" opacity="0.5"/>
  <line x1="22" y1="28" x2="34" y2="28" stroke="#9a8030" stroke-width="1.5" opacity="0.5"/>
  <!-- Shadow side (far side, deeper) -->
  <path d="M4 20 Q6 60 6 100 Q8 130 10 140 L16 142 Q10 130 8 100 Q6 60 8 20 Z" fill="#0a0a0a" opacity="0.2"/>
  <!-- Candle wax drip -->
  <path d="M32 60 Q33 66 32 72" stroke="#c8c090" stroke-width="1.5" fill="none" opacity="0.3"/>
</svg>
