  <line x1="36" y1="12" x2="40" y2="14" stroke="#1a1008" stroke-width="0.5" opacity="0.3"/>
  <line x1="46" y1="14" x2="52" y2="16" stroke="#1a1008" stroke-width="0.5" opacity="0.3"/>
