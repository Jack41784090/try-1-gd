  <line x1="50" y1="44" x2="70" y2="44" stroke="#241810" stroke-width="0.8" opacity="0.4"/>
  <!-- Foot/ankle area -->
  <path d="M16 4 Q14 12 12 24 Q10 32 14 36 Q20 34 36 32 Q56 30 72 32 Q78 34 80 36 Q82 28 78 18 Q74 8 64 4 Q46 0 28 2 Q20 2 16 4 Z" fill="url(#sandalLeatherR)" stroke="#0a0a0a" stroke-width="2"/>
