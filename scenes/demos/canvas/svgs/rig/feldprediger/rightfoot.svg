  <path d="M26 6 Q34 20 30 30" stroke="#4a3420" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M56 6 Q50 18 52 28" stroke="#4a3420" stroke-width="2.5" fill="none" stroke-linecap="round"/>
