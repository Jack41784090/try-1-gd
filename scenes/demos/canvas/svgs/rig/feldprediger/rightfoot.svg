      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="40%" stop-color="#2e2014"/>
      <stop offset="100%" stop-color="#1a1208"/>
    </linearGradient>
    <linearGradient id="soleGradR" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1c10"/>
      <stop offset="100%" stop-color="#181008"/>
    </linearGradient>
  </defs>
  <!-- Sole base -->
  <path d="M10 36 Q6 38 8 44 Q16 48 56 48 Q78 48 84 44 Q88 38 82 34 Q72 30 36 30 Q16 30 10 36 Z" fill="url(#soleGradR)" stroke="#0a0a0a" stroke-width="2"/>
