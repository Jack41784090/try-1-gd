  <path d="M22 18 Q42 26 72 20" stroke="#4a3420" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M22 18 Q42 26 72 20" stroke="#5a4428" stroke-width="1" fill="none" opacity="0.5"/>
