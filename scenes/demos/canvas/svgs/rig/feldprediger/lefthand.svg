<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <radialGradient id="handSkinL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d0c0a0"/>
      <stop offset="80%" stop-color="#b8a888"/>
      <stop offset="100%" stop-color="#a09070"/>
    </radialGradient>
  </defs>
  <!-- Wrist wrapping -->
  <rect x="8" y="0" width="24" height="8" rx="3" fill="#c0b890" stroke="#0a0a0a" stroke-width="1.5"/>
  <line x1="10" y1="3" x2="30" y2="3" stroke="#a89870" stroke-width="0.8" opacity="0.5"/>
  <line x1="10" y1="6" x2="30" y2="6" stroke="#a89870" stroke-width="0.8" opacity="0.5"/>
  <!-- Holy text on wrapping -->
  <line x1="12" y1="4" x2="16" y2="4" stroke="#3a2818" stroke-width="0.5" opacity="0.5"/>
  <line x1="18" y1="4" x2="24" y2="4" stroke="#3a2818" stroke-width="0.5" opacity="0.4"/>
  <!-- Palm base -->
  <path d="M8 8 Q6 14 8 24 Q10 32 20 36 Q30 32 32 24 Q34 14 32 8 Z" fill="url(#handSkinL)" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Palm lines -->
  <path d="M12 16 Q18 18 26 16" stroke="#8a7860" stroke-width="0.7" fill="none" opacity="0.4"/>
  <path d="M14 22 Q18 24 24 22" stroke="#8a7860" stroke-width="0.7" fill="none" opacity="0.4"/>
  <!-- Fingers -->
  <path d="M10 24 Q8 30 10 36" stroke="#0a0a0a" stroke-width="1.5" fill="url(#handSkinL)"/>
  <path d="M16 26 Q14 34 16 38" stroke="#0a0a0a" stroke-width="1.5" fill="url(#handSkinL)"/>
  <path d="M22 26 Q24 34 22 38" stroke="#0a0a0a" stroke-width="1.5" fill="url(#handSkinL)"/>
  <path d="M28 24 Q30 30 28 36" stroke="#0a0a0a" stroke-width="1.5" fill="url(#handSkinL)"/>
  <!-- Scarred knuckles - flagellation marks -->
  <line x1="10" y1="24" x2="14" y2="24" stroke="#7a3838" stroke-width="1" opacity="0.6"/>
  <line x1="16" y1="25" x2="20" y2="25" stroke="#7a3838" stroke-width="0.8" opacity="0.5"/>
  <line x1="22" y1="25" x2="26" y2="25" stroke="#7a3838" stroke-width="0.8" opacity="0.5"/>
  <line x1="27" y1="24" x2="30" y2="24" stroke="#7a3838" stroke-width="1" opacity="0.6"/>
  <!-- Small scars on back of hand -->
  <line x1="18" y1="18" x2="20" y2="16" stroke="#8a5050" stroke-width="0.6" opacity="0.4"/>
  <line x1="24" y1="20" x2="26" y2="18" stroke="#8a5050" stroke-width="0.6" opacity="0.4"/>
  <!-- Shadow on far side -->
  <path d="M8 10 Q6 18 8 28 Q10 32 12 34" fill="#0a0a0a" opacity="0.15"/>
</svg>
