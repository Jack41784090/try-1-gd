  <path d="M30 6 Q38 20 34 30" stroke="#4a3420" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M60 6 Q54 18 56 28" stroke="#4a3420" stroke-width="2.5" fill="none" stroke-linecap="round"/>
