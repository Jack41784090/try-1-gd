  <path d="M22 8 Q40 18 78 10" stroke="#4a3420" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M22 8 Q40 18 78 10" stroke="#5a4428" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M26 18 Q46 26 76 20" stroke="#4a3420" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M26 18 Q46 26 76 20" stroke="#5a4428" stroke-width="1" fill="none" opacity="0.5"/>
