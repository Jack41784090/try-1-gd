      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="50%" stop-color="#2a1c10"/>
      <stop offset="100%" stop-color="#1a1208"/>
    </linearGradient>
    <linearGradient id="soleGradL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1c10"/>
      <stop offset="100%" stop-color="#181008"/>
    </linearGradient>
  </defs>
  <!-- Sole base -->
  <path d="M14 36 Q10 38 12 44 Q20 48 60 48 Q82 48 88 44 Q92 38 86 34 Q76 30 40 30 Q20 30 14 36 Z" fill="url(#soleGradL)" stroke="#0a0a0a" stroke-width="2"/>
