  <circle cx="30" cy="6" r="2" fill="#3a2818" stroke="#0a0a0a" stroke-width="1"/>
  <circle cx="60" cy="6" r="2" fill="#3a2818" stroke="#0a0a0a" stroke-width="1"/>
