  <line x1="55" y1="44" x2="75" y2="44" stroke="#241810" stroke-width="0.8" opacity="0.4"/>
  <!-- Foot/ankle area -->
  <path d="M20 4 Q18 12 16 24 Q14 32 18 36 Q24 34 40 32 Q60 30 76 32 Q82 34 84 36 Q86 28 82 18 Q78 8 68 4 Q50 0 32 2 Q24 2 20 4 Z" fill="url(#sandalLeatherL)" stroke="#0a0a0a" stroke-width="2"/>
