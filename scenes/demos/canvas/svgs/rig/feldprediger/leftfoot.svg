  <line x1="40" y1="12" x2="44" y2="14" stroke="#1a1008" stroke-width="0.5" opacity="0.3"/>
  <line x1="50" y1="14" x2="56" y2="16" stroke="#1a1008" stroke-width="0.5" opacity="0.3"/>
  <line x1="66" y1="24" x2="72" y2="26" stroke="#1a1008" stroke-width="0.5" opacity="0.3"/>
