<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 48" width="96" height="48">
  <defs>
    <linearGradient id="lfoot-shadow" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="lfoot-hatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(135)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#0a0a0a" stroke-width="0.4" opacity="0.15"/>
    </pattern>
  </defs>
  <!-- Boot base -->
  <path d="M10 4 L86 4 Q92 4 92 10 L92 38 Q92 44 86 44 L10 44 Q4 44 4 38 L4 10 Q4 4 10 4 Z" fill="#3a2518" stroke="#0a0a0a" stroke-width="2.5"/>
  <!-- Boot upper leather -->
  <path d="M14 6 L80 6 Q86 6 86 12 L86 24 Q50 28 14 24 L14 12 Q14 6 14 6 Z" fill="#4a3020"/>
  <!-- Steel toe cap -->
  <path d="M4 10 Q4 4 10 4 L38 4 L38 36 Q38 44 30 44 L10 44 Q4 44 4 38 Z" fill="#3a3a42" stroke="#0a0a0a" stroke-width="2"/>
  <path d="M8 8 L34 8 L34 20 Q8 18 8 8 Z" fill="#52525a" opacity="0.5"/>
  <!-- Toe cap scratches -->
  <path d="M10 14 L28 12" stroke="#5a5a64" stroke-width="0.7" fill="none" opacity="0.5"/>
  <path d="M12 22 L30 20" stroke="#5a5a64" stroke-width="0.6" fill="none" opacity="0.4"/>
  <path d="M8 30 L26 28" stroke="#5a5a64" stroke-width="0.5" fill="none" opacity="0.35"/>
  <!-- Toe cap rivet -->
  <circle cx="20" cy="16" r="2.5" fill="#2a2a30" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="19" cy="15" r="0.8" fill="#6a6a74" opacity="0.4"/>
  <!-- Boot seam -->
  <line x1="38" y1="6" x2="38" y2="42" stroke="#0a0a0a" stroke-width="1.5" opacity="0.5"/>
  <!-- Leather stitching -->
  <path d="M44 14 L80 14" stroke="#2a1810" stroke-width="0.8" fill="none" stroke-dasharray="2,3" opacity="0.5"/>
  <path d="M44 28 L80 28" stroke="#2a1810" stroke-width="0.7" fill="none" stroke-dasharray="2,3" opacity="0.4"/>
  <!-- Boot sole -->
  <rect x="4" y="40" width="88" height="6" rx="3" fill="#1a0f08" stroke="#0a0a0a" stroke-width="1"/>
  <!-- Leather texture -->
  <path d="M50 18 Q60 20 50 24" stroke="#3a2518" stroke-width="0.7" fill="none" opacity="0.3"/>
  <path d="M68 16 Q76 18 68 22" stroke="#3a2518" stroke-width="0.6" fill="none" opacity="0.25"/>
  <!-- Shadow overlay -->
  <path d="M10 4 L86 4 Q92 4 92 10 L92 38 Q92 44 86 44 L10 44 Q4 44 4 38 L4 10 Q4 4 10 4 Z" fill="url(#lfoot-shadow)"/>
  <!-- Cross-hatching -->
  <rect x="4" y="4" width="44" height="40" fill="url(#lfoot-hatch)"/>
</svg>
