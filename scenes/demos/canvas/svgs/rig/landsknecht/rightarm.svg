<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 144" width="56" height="144">
  <defs>
    <linearGradient id="rarm-shadow" x1="1" y1="0" x2="0" y2="0.2">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="rarm-hatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#0a0a0a" stroke-width="0.5" opacity="0.12"/>
    </pattern>
  </defs>
  <!-- Arm base - crimson sleeve -->
  <rect x="3" y="3" width="50" height="138" rx="10" fill="#8b2020" stroke="#0a0a0a" stroke-width="2.5"/>
  <!-- Steel pauldron cap at shoulder -->
  <path d="M2 3 Q28 -4 54 3 L54 32 Q28 38 2 32 Z" fill="#3a3a42" stroke="#0a0a0a" stroke-width="2"/>
  <path d="M6 6 Q28 0 50 6 L50 20 Q28 24 6 20 Z" fill="#52525a" opacity="0.6"/>
  <!-- Pauldron ridges -->
  <path d="M10 12 Q28 8 46 12" stroke="#5a5a64" stroke-width="0.8" fill="none" opacity="0.5"/>
  <path d="M8 20 Q28 16 48 20" stroke="#5a5a64" stroke-width="0.6" fill="none" opacity="0.4"/>
  <!-- Pauldron rivets -->
  <circle cx="14" cy="16" r="2.5" fill="#2a2a30" stroke="#0a0a0a" stroke-width="1"/>
  <circle cx="42" cy="16" r="2.5" fill="#2a2a30" stroke="#0a0a0a" stroke-width="1"/>
  <circle cx="13" cy="15" r="0.8" fill="#6a6a74" opacity="0.4"/>
  <circle cx="41" cy="15" r="0.8" fill="#6a6a74" opacity="0.4"/>
  <!-- Slashed sleeve - diagonal cuts -->
  <path d="M12 42 L46 57" stroke="#3a0e0e" stroke-width="5" fill="none" opacity="0.6"/>
  <path d="M10 64 L48 79" stroke="#3a0e0e" stroke-width="4.5" fill="none" opacity="0.55"/>
  <path d="M8 85 L46 100" stroke="#3a0e0e" stroke-width="5" fill="none" opacity="0.5"/>
  <path d="M12 106 L44 120" stroke="#3a0e0e" stroke-width="4" fill="none" opacity="0.5"/>
  <!-- Slash fabric edges - lighter crimson -->
  <path d="M12 41 L46 56" stroke="#a03030" stroke-width="0.8" fill="none" opacity="0.5"/>
  <path d="M10 63 L48 78" stroke="#a03030" stroke-width="0.7" fill="none" opacity="0.4"/>
  <path d="M8 84 L46 99" stroke="#a03030" stroke-width="0.8" fill="none" opacity="0.45"/>
  <path d="M12 105 L44 119" stroke="#a03030" stroke-width="0.7" fill="none" opacity="0.4"/>
  <!-- Fabric fold lines -->
  <path d="M42 48 Q46 65 42 82" stroke="#5a1010" stroke-width="1" fill="none" opacity="0.35"/>
  <path d="M14 55 Q10 72 14 90" stroke="#5a1010" stroke-width="0.8" fill="none" opacity="0.3"/>
  <!-- Cuff at bottom -->
  <rect x="3" y="126" width="50" height="15" rx="6" fill="#8b2020" stroke="#0a0a0a" stroke-width="1.5"/>
  <path d="M6 130 Q28 128 50 130" stroke="#a08030" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- Shadow overlay -->
  <rect x="3" y="3" width="50" height="138" rx="10" fill="url(#rarm-shadow)"/>
  <!-- Cross-hatching -->
  <rect x="28" y="3" width="25" height="138" rx="10" fill="url(#rarm-hatch)"/>
</svg>
