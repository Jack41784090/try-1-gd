<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 192" width="64" height="192">
  <defs>
    <linearGradient id="rleg-shadow" x1="1" y1="0" x2="0" y2="0.15">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="rleg-hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#0a0a0a" stroke-width="0.5" opacity="0.12"/>
    </pattern>
  </defs>
  <!-- Leg base - dark breeches -->
  <rect x="3" y="3" width="58" height="186" rx="10" fill="#3a2518" stroke="#0a0a0a" stroke-width="2.5"/>
  <!-- Breeches fabric -->
  <rect x="6" y="6" width="52" height="180" rx="8" fill="#4a3020" opacity="0.6"/>
  <!-- Vertical slashes showing inner fabric -->
  <path d="M18 18 L20 52" stroke="#2a0e0e" stroke-width="5" fill="none" opacity="0.5"/>
  <path d="M34 22 L36 56" stroke="#2a0e0e" stroke-width="4.5" fill="none" opacity="0.45"/>
  <path d="M48 16 L50 50" stroke="#2a0e0e" stroke-width="4" fill="none" opacity="0.5"/>
  <path d="M14 68 L16 105" stroke="#2a0e0e" stroke-width="5" fill="none" opacity="0.45"/>
  <path d="M38 72 L40 108" stroke="#2a0e0e" stroke-width="4.5" fill="none" opacity="0.5"/>
  <path d="M22 118 L24 155" stroke="#2a0e0e" stroke-width="4" fill="none" opacity="0.4"/>
  <path d="M42 115 L44 150" stroke="#2a0e0e" stroke-width="4.5" fill="none" opacity="0.45"/>
  <path d="M12 125 L14 158" stroke="#2a0e0e" stroke-width="4" fill="none" opacity="0.4"/>
  <!-- Slash edge highlights -->
  <path d="M19 18 L21 52" stroke="#5c3d28" stroke-width="0.7" fill="none" opacity="0.4"/>
  <path d="M35 22 L37 56" stroke="#5c3d28" stroke-width="0.6" fill="none" opacity="0.35"/>
  <path d="M49 16 L51 50" stroke="#5c3d28" stroke-width="0.7" fill="none" opacity="0.35"/>
  <!-- Fabric fold lines -->
  <path d="M52 35 Q56 75 52 115" stroke="#2a1810" stroke-width="1" fill="none" opacity="0.35"/>
  <path d="M14 40 Q10 80 14 120" stroke="#2a1810" stroke-width="0.8" fill="none" opacity="0.3"/>
  <path d="M34 100 Q30 140 34 175" stroke="#2a1810" stroke-width="0.8" fill="none" opacity="0.25"/>
  <!-- Knee reinforcement patch -->
  <ellipse cx="32" cy="96" rx="18" ry="14" fill="#3a2518" stroke="#0a0a0a" stroke-width="1" opacity="0.5"/>
  <ellipse cx="32" cy="96" rx="12" ry="9" fill="#5c3d28" opacity="0.3"/>
  <ellipse cx="32" cy="96" rx="14" ry="11" fill="none" stroke="#2a1810" stroke-width="0.6" stroke-dasharray="2,3" opacity="0.4"/>
  <!-- Cuff at bottom -->
  <rect x="3" y="175" width="58" height="14" rx="6" fill="#3a2518" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Shadow overlay -->
  <rect x="3" y="3" width="58" height="186" rx="10" fill="url(#rleg-shadow)"/>
  <!-- Cross-hatching -->
  <rect x="32" y="3" width="29" height="186" rx="10" fill="url(#rleg-hatch)"/>
</svg>
