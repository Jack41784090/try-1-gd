<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" width="160" height="48">
  <defs>
    <linearGradient id="belt-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="belt-hatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#0a0a0a" stroke-width="0.4" opacity="0.15"/>
    </pattern>
  </defs>
  <!-- Belt base -->
  <rect x="2" y="2" width="156" height="44" rx="6" fill="#3a2518" stroke="#0a0a0a" stroke-width="2.5"/>
  <!-- Leather texture layer -->
  <rect x="2" y="2" width="156" height="44" rx="6" fill="#4a3020" opacity="0.5"/>
  <!-- Upper belt strap -->
  <rect x="4" y="4" width="152" height="16" rx="4" fill="#5c3d28" stroke="#0a0a0a" stroke-width="1"/>
  <!-- Lower belt strap -->
  <rect x="4" y="28" width="152" height="16" rx="4" fill="#4a3020" stroke="#0a0a0a" stroke-width="1"/>
  <!-- Center buckle -->
  <rect x="64" y="6" width="32" height="36" rx="4" fill="#3a3a42" stroke="#0a0a0a" stroke-width="2"/>
  <rect x="68" y="10" width="24" height="28" rx="2" fill="#52525a"/>
  <!-- Buckle prong -->
  <rect x="78" y="8" width="4" height="32" rx="1" fill="#3a3a42" stroke="#0a0a0a" stroke-width="1"/>
  <!-- Buckle highlight -->
  <rect x="70" y="12" width="8" height="4" rx="1" fill="#6a6a74" opacity="0.5"/>
  <!-- Rivets along belt -->
  <circle cx="20" cy="12" r="3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="1"/>
  <circle cx="44" cy="12" r="3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="1"/>
  <circle cx="116" cy="12" r="3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="1"/>
  <circle cx="140" cy="12" r="3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="1"/>
  <!-- Rivet highlights -->
  <circle cx="19" cy="11" r="1" fill="#6a6a74" opacity="0.4"/>
  <circle cx="43" cy="11" r="1" fill="#6a6a74" opacity="0.4"/>
  <circle cx="115" cy="11" r="1" fill="#6a6a74" opacity="0.4"/>
  <circle cx="139" cy="11" r="1" fill="#6a6a74" opacity="0.4"/>
  <!-- Leather stitching -->
  <path d="M10 24 L20 24 M28 24 L38 24 M100 24 L110 24 M118 24 L128 24 M136 24 L146 24" stroke="#2a1810" stroke-width="1" fill="none" stroke-dasharray="3,3" opacity="0.5"/>
  <!-- Shadow underneath -->
  <rect x="2" y="2" width="156" height="44" rx="6" fill="url(#belt-shadow)"/>
  <!-- Cross-hatching -->
  <rect x="2" y="2" width="80" height="44" rx="6" fill="url(#belt-hatch)"/>
  <!-- Leather wear marks -->
  <path d="M22 30 L40 32" stroke="#5c3d28" stroke-width="0.6" fill="none" opacity="0.4"/>
  <path d="M110 34 L135 32" stroke="#5c3d28" stroke-width="0.6" fill="none" opacity="0.4"/>
</svg>
