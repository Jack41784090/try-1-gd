<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 192" width="64" height="192">
  <defs>
    <linearGradient id="lleg-shadow" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="lleg-hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(135)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#0a0a0a" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </defs>
  <!-- Leg base - dark breeches -->
  <rect x="3" y="3" width="58" height="186" rx="10" fill="#3a2518" stroke="#0a0a0a" stroke-width="2.5"/>
  <!-- Breeches fabric -->
  <rect x="6" y="6" width="52" height="180" rx="8" fill="#4a3020" opacity="0.6"/>
  <!-- Vertical slashes showing inner fabric -->
  <path d="M16 20 L18 55" stroke="#2a0e0e" stroke-width="5" fill="none" opacity="0.5"/>
  <path d="M32 15 L34 50" stroke="#2a0e0e" stroke-width="4" fill="none" opacity="0.45"/>
  <path d="M46 25 L48 60" stroke="#2a0e0e" stroke-width="5" fill="none" opacity="0.5"/>
  <path d="M20 70 L22 108" stroke="#2a0e0e" stroke-width="4.5" fill="none" opacity="0.45"/>
  <path d="M40 65 L42 100" stroke="#2a0e0e" stroke-width="5" fill="none" opacity="0.5"/>
  <path d="M14 115 L16 150" stroke="#2a0e0e" stroke-width="4" fill="none" opacity="0.4"/>
  <path d="M36 120 L38 155" stroke="#2a0e0e" stroke-width="4.5" fill="none" opacity="0.45"/>
  <path d="M50 110 L52 145" stroke="#2a0e0e" stroke-width="4" fill="none" opacity="0.4"/>
  <!-- Slash edge highlights -->
  <path d="M15 20 L17 55" stroke="#5c3d28" stroke-width="0.7" fill="none" opacity="0.4"/>
  <path d="M31 15 L33 50" stroke="#5c3d28" stroke-width="0.6" fill="none" opacity="0.35"/>
  <path d="M45 25 L47 60" stroke="#5c3d28" stroke-width="0.7" fill="none" opacity="0.4"/>
  <!-- Fabric fold lines -->
  <path d="M12 40 Q8 80 12 120" stroke="#2a1810" stroke-width="1" fill="none" opacity="0.35"/>
  <path d="M50 30 Q54 70 50 110" stroke="#2a1810" stroke-width="0.8" fill="none" opacity="0.3"/>
  <path d="M30 90 Q26 130 30 170" stroke="#2a1810" stroke-width="0.8" fill="none" opacity="0.25"/>
  <!-- Knee reinforcement patch -->
  <ellipse cx="32" cy="96" rx="18" ry="14" fill="#3a2518" stroke="#0a0a0a" stroke-width="1" opacity="0.5"/>
  <ellipse cx="32" cy="96" rx="12" ry="9" fill="#5c3d28" opacity="0.3"/>
  <!-- Stitching on knee patch -->
  <ellipse cx="32" cy="96" rx="14" ry="11" fill="none" stroke="#2a1810" stroke-width="0.6" stroke-dasharray="2,3" opacity="0.4"/>
  <!-- Cuff at bottom -->
  <rect x="3" y="175" width="58" height="14" rx="6" fill="#3a2518" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Shadow overlay -->
  <rect x="3" y="3" width="58" height="186" rx="10" fill="url(#lleg-shadow)"/>
  <!-- Cross-hatching -->
  <rect x="3" y="3" width="30" height="186" rx="10" fill="url(#lleg-hatch)"/>
</svg>
