<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 104" width="88" height="104">
  <defs>
    <pattern id="head-hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#0a0a0a" stroke-width="0.5" opacity="0.15"/>
    </pattern>
    <linearGradient id="head-shadow" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="eye-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffcc44" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff8800" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Ears -->
  <ellipse cx="6" cy="52" rx="7" ry="10" fill="#a07050" stroke="#0a0a0a" stroke-width="2"/>
  <ellipse cx="6" cy="52" rx="4" ry="6" fill="#8a6040"/>
  <ellipse cx="82" cy="52" rx="7" ry="10" fill="#a07050" stroke="#0a0a0a" stroke-width="2"/>
  <ellipse cx="82" cy="52" rx="4" ry="6" fill="#8a6040"/>
  <!-- Face base -->
  <ellipse cx="44" cy="54" rx="38" ry="44" fill="#c49070" stroke="#0a0a0a" stroke-width="2.5"/>
  <!-- Face shadow overlay left side -->
  <ellipse cx="44" cy="54" rx="38" ry="44" fill="url(#head-shadow)"/>
  <!-- Cross-hatching on shadow side -->
  <ellipse cx="44" cy="54" rx="38" ry="44" fill="url(#head-hatch)"/>
  <!-- Jaw shadow -->
  <path d="M14 62 Q18 94 44 100 Q70 94 74 62" fill="#0a0a0a" opacity="0.15"/>
  <!-- Hair - dark, short, military crop -->
  <path d="M6 30 Q6 6 28 2 Q44 -2 60 2 Q82 6 82 30 Q82 38 44 34 Q6 38 6 30Z" fill="#1a0f08" stroke="#0a0a0a" stroke-width="2"/>
  <path d="M8 28 Q10 34 20 32 Q14 16 28 8" fill="#0a0a0a" opacity="0.3"/>
  <path d="M80 28 Q78 34 68 32 Q74 16 60 8" fill="#0a0a0a" opacity="0.3"/>
  <!-- Hair texture strands -->
  <path d="M20 8 Q24 4 30 6" stroke="#2a1a10" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M50 4 Q58 3 66 8" stroke="#2a1a10" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M36 4 Q44 2 52 4" stroke="#2a1a10" stroke-width="0.8" fill="none" opacity="0.4"/>
  <!-- Forehead -->
  <path d="M14 32 Q44 26 74 32 Q74 42 44 40 Q14 42 14 32Z" fill="#c49070"/>
  <!-- Heavy brow ridge -->
  <path d="M14 38 Q30 32 44 34 Q58 32 74 38" fill="#a07050" stroke="#0a0a0a" stroke-width="1.5"/>
  <path d="M14 38 Q30 32 44 34 Q58 32 74 38" fill="#0a0a0a" opacity="0.12"/>
  <!-- Sideburns / stubble shadow -->
  <path d="M10 36 Q7 52 12 66" stroke="#1a0f08" stroke-width="5" fill="none" opacity="0.5"/>
  <path d="M78 36 Q81 52 76 66" stroke="#1a0f08" stroke-width="5" fill="none" opacity="0.4"/>
  <!-- Stubble texture on jaw -->
  <path d="M18 72 Q20 78 22 82" stroke="#1a0f08" stroke-width="0.6" fill="none" opacity="0.3"/>
  <path d="M24 74 Q26 80 28 84" stroke="#1a0f08" stroke-width="0.6" fill="none" opacity="0.3"/>
  <path d="M60 74 Q62 80 64 84" stroke="#1a0f08" stroke-width="0.6" fill="none" opacity="0.25"/>
  <path d="M66 72 Q68 78 70 82" stroke="#1a0f08" stroke-width="0.6" fill="none" opacity="0.25"/>
  <!-- Eyebrows - heavy, menacing -->
  <path d="M16 40 Q24 33 38 37" stroke="#0a0a0a" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M50 37 Q64 33 72 40" stroke="#0a0a0a" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <!-- Deep-set eye sockets -->
  <ellipse cx="30" cy="48" rx="11" ry="8" fill="#0a0a0a" opacity="0.25"/>
  <ellipse cx="58" cy="48" rx="11" ry="8" fill="#0a0a0a" opacity="0.2"/>
  <!-- Eye whites -->
  <ellipse cx="30" cy="48" rx="8" ry="5" fill="#e8e0d0" stroke="#0a0a0a" stroke-width="1"/>
  <ellipse cx="58" cy="48" rx="8" ry="5" fill="#e8e0d0" stroke="#0a0a0a" stroke-width="1"/>
  <!-- Iris glow -->
  <circle cx="31" cy="48" r="6" fill="url(#eye-glow)"/>
  <circle cx="59" cy="48" r="6" fill="url(#eye-glow)"/>
  <!-- Irises - amber/determined -->
  <circle cx="31" cy="48" r="4" fill="#8a6020"/>
  <circle cx="59" cy="48" r="4" fill="#8a6020"/>
  <!-- Pupils -->
  <circle cx="31" cy="48" r="2" fill="#0a0a0a"/>
  <circle cx="59" cy="48" r="2" fill="#0a0a0a"/>
  <!-- Eye highlights -->
  <circle cx="33" cy="46.5" r="1.3" fill="#fff" opacity="0.85"/>
  <circle cx="61" cy="46.5" r="1.3" fill="#fff" opacity="0.85"/>
  <!-- Heavy upper eyelids -->
  <path d="M22 45 Q30 40 38 45" stroke="#0a0a0a" stroke-width="2" fill="none"/>
  <path d="M50 45 Q58 40 66 45" stroke="#0a0a0a" stroke-width="2" fill="none"/>
  <!-- Under-eye dark circles -->
  <path d="M22 53 Q28 56 36 53" stroke="#5a3a2a" stroke-width="1.2" fill="none" opacity="0.5"/>
  <path d="M52 53 Q58 56 66 53" stroke="#5a3a2a" stroke-width="1.2" fill="none" opacity="0.5"/>
  <!-- SCAR across right cheek - ragged -->
  <path d="M54 42 L62 56 L68 64" stroke="#d4a888" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M54 42 L62 56 L68 64" stroke="#ecc8a8" stroke-width="0.8" fill="none" opacity="0.5"/>
  <!-- Secondary scar nick on brow -->
  <path d="M64 36 L66 42" stroke="#d4a888" stroke-width="1.2" fill="none" opacity="0.6"/>
  <!-- Nose - strong, slightly crooked -->
  <path d="M44 50 L41 64 Q37 69 34 68" stroke="#0a0a0a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M47 64 Q51 69 54 68" stroke="#0a0a0a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M39 65 Q44 68 49 65" stroke="#8a6040" stroke-width="1.5" fill="none"/>
  <!-- Nose shadow -->
  <ellipse cx="37" cy="65" rx="3.5" ry="2.5" fill="#8a6040" opacity="0.4"/>
  <ellipse cx="51" cy="65" rx="3.5" ry="2.5" fill="#8a6040" opacity="0.4"/>
  <!-- Nasolabial folds -->
  <path d="M26 58 Q28 68 30 74" stroke="#8a6040" stroke-width="1.2" fill="none" opacity="0.4"/>
  <path d="M62 58 Q60 68 58 74" stroke="#8a6040" stroke-width="1.2" fill="none" opacity="0.35"/>
  <!-- Mouth - grim set -->
  <path d="M32 78 Q44 82 56 78" stroke="#0a0a0a" stroke-width="1.5" fill="#4a2020" opacity="0.8"/>
  <path d="M35 80 Q44 83 53 80" fill="#6b3030" opacity="0.5"/>
  <!-- Chin shadow -->
  <ellipse cx="44" cy="90" rx="14" ry="7" fill="#0a0a0a" opacity="0.1"/>
  <!-- Jaw stubble stipple -->
  <circle cx="30" cy="86" r="0.6" fill="#1a0f08" opacity="0.2"/>
  <circle cx="36" cy="88" r="0.6" fill="#1a0f08" opacity="0.2"/>
  <circle cx="44" cy="90" r="0.6" fill="#1a0f08" opacity="0.2"/>
  <circle cx="52" cy="88" r="0.6" fill="#1a0f08" opacity="0.2"/>
  <circle cx="58" cy="86" r="0.6" fill="#1a0f08" opacity="0.2"/>
  <!-- Neck suggestion at bottom -->
  <rect x="28" y="94" width="32" height="10" rx="4" fill="#b0784e" stroke="#0a0a0a" stroke-width="1.5"/>
  <rect x="28" y="94" width="16" height="10" rx="4" fill="#0a0a0a" opacity="0.15"/>
  <!-- Face outline - heavy dark stroke -->
  <ellipse cx="44" cy="54" rx="38" ry="44" fill="none" stroke="#0a0a0a" stroke-width="2.5"/>
</svg>
