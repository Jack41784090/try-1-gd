<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 144" width="56" height="144">
  <defs>
    <linearGradient id="larm-shadow" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="larm-hatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(135)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#0a0a0a" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </defs>
  <!-- Arm base - crimson sleeve -->
  <rect x="3" y="3" width="50" height="138" rx="10" fill="#6b1a1a" stroke="#0a0a0a" stroke-width="2.5"/>
  <!-- Steel pauldron at top -->
  <path d="M2 3 Q28 -4 54 3 L54 30 Q28 36 2 30 Z" fill="#3a3a42" stroke="#0a0a0a" stroke-width="2"/>
  <path d="M6 6 Q28 0 50 6 L50 18 Q28 22 6 18 Z" fill="#52525a" opacity="0.5"/>
  <!-- Pauldron rivet -->
  <circle cx="28" cy="14" r="3" fill="#2a2a30" stroke="#0a0a0a" stroke-width="1"/>
  <circle cx="27" cy="13" r="1" fill="#6a6a74" opacity="0.4"/>
  <!-- Pauldron edge highlight -->
  <path d="M8 28 Q28 34 48 28" stroke="#5a5a64" stroke-width="0.8" fill="none" opacity="0.4"/>
  <!-- Slashed sleeve - diagonal cuts revealing dark inner fabric -->
  <path d="M8 40 L42 55" stroke="#2a0e0e" stroke-width="5" fill="none" opacity="0.6"/>
  <path d="M10 60 L44 75" stroke="#2a0e0e" stroke-width="4" fill="none" opacity="0.5"/>
  <path d="M6 80 L40 95" stroke="#2a0e0e" stroke-width="5" fill="none" opacity="0.55"/>
  <path d="M8 100 L42 115" stroke="#2a0e0e" stroke-width="4" fill="none" opacity="0.5"/>
  <!-- Slash edge highlights -->
  <path d="M8 39 L42 54" stroke="#8b2020" stroke-width="0.8" fill="none" opacity="0.5"/>
  <path d="M10 59 L44 74" stroke="#8b2020" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M6 79 L40 94" stroke="#8b2020" stroke-width="0.8" fill="none" opacity="0.5"/>
  <path d="M8 99 L42 114" stroke="#8b2020" stroke-width="0.8" fill="none" opacity="0.4"/>
  <!-- Fabric folds -->
  <path d="M12 50 Q16 65 12 80" stroke="#4a1010" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M40 45 Q44 60 40 75" stroke="#4a1010" stroke-width="0.8" fill="none" opacity="0.3"/>
  <!-- Cuff at bottom -->
  <rect x="3" y="126" width="50" height="15" rx="6" fill="#8b2020" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Shadow overlay -->
  <rect x="3" y="3" width="50" height="138" rx="10" fill="url(#larm-shadow)"/>
  <!-- Cross-hatching -->
  <rect x="3" y="3" width="26" height="138" rx="10" fill="url(#larm-hatch)"/>
</svg>
