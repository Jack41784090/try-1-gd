<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 144" width="56" height="144">
  <defs>
    <linearGradient id="rsSteel" x1="1" y1="0" x2="0" y2="0.3">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="40%" stop-color="#4a4a52"/>
      <stop offset="100%" stop-color="#3a3a42"/>
    </linearGradient>
    <pattern id="rsHatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#1a1a2a" stroke-width="0.4" opacity="0.25"/>
    </pattern>
    <pattern id="rsHatch2" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1a1a2a" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>
  <!-- Leather backing -->
  <rect x="12" y="4" width="32" height="136" rx="8" fill="#2a1a10" stroke="#1a0f08" stroke-width="0.8"/>
  <!-- Main greave plate -->
  <path d="M6 8 Q6 2 14 2 L42 2 Q50 2 50 8 L52 124 Q52 136 42 140 L14 140 Q4 136 4 124Z" fill="url(#rsSteel)" stroke="#0a0a0a" stroke-width="2"/>
  <path d="M6 8 Q6 2 14 2 L42 2 Q50 2 50 8 L52 124 Q52 136 42 140 L14 140 Q4 136 4 124Z" fill="url(#rsHatch)"/>
  <path d="M6 8 Q6 2 14 2 L42 2 Q50 2 50 8 L52 124 Q52 136 42 140 L14 140 Q4 136 4 124Z" fill="url(#rsHatch2)"/>
  <!-- Median ridge -->
  <line x1="28" y1="6" x2="28" y2="136" stroke="#606068" stroke-width="1.2" opacity="0.4"/>
  <line x1="27" y1="6" x2="27" y2="136" stroke="#2a2a30" stroke-width="0.8" opacity="0.4"/>
  <!-- Plate articulation -->
  <path d="M8 36 Q28 40 48 36" stroke="#1a1a2a" stroke-width="1" fill="none"/>
  <path d="M6 72 Q28 76 50 72" stroke="#1a1a2a" stroke-width="1" fill="none"/>
  <path d="M6 108 Q28 112 50 108" stroke="#1a1a2a" stroke-width="1" fill="none"/>
  <!-- Sheen on near side -->
  <path d="M12 4 Q6 12 6 36 L6 72" stroke="#72727a" stroke-width="1.8" fill="none" opacity="0.4"/>
  <path d="M14 6 Q8 14 8 30" stroke="#8a8a92" stroke-width="0.8" fill="none" opacity="0.25"/>
  <!-- Rivets -->
  <circle cx="12" cy="10" r="1.3" fill="#4a4a52" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="44" cy="10" r="1.3" fill="#4a4a52" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="12" cy="54" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="44" cy="54" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="12" cy="90" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="44" cy="90" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="12" cy="126" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="44" cy="126" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <!-- Leather straps -->
  <rect x="8" y="24" width="40" height="4" rx="1" fill="#2a1a10" stroke="#1a0f08" stroke-width="0.7"/>
  <rect x="8" y="60" width="40" height="4" rx="1" fill="#2a1a10" stroke="#1a0f08" stroke-width="0.7"/>
  <rect x="8" y="96" width="40" height="4" rx="1" fill="#2a1a10" stroke="#1a0f08" stroke-width="0.7"/>
  <!-- Buckles on near side -->
  <rect x="10" y="23" width="5" height="6" rx="1" fill="#4a4a52" stroke="#0a0a0a" stroke-width="0.6"/>
  <rect x="10" y="59" width="5" height="6" rx="1" fill="#4a4a52" stroke="#0a0a0a" stroke-width="0.6"/>
  <!-- Shadow on far side -->
  <rect x="34" y="2" width="18" height="138" rx="4" fill="#0a0a0a" opacity="0.12"/>
  <!-- Battle scars -->
  <line x1="30" y1="18" x2="38" y2="30" stroke="#606068" stroke-width="0.7" opacity="0.45"/>
  <line x1="14" y1="82" x2="20" y2="94" stroke="#606068" stroke-width="0.5" opacity="0.4"/>
  <ellipse cx="36" cy="58" rx="3" ry="4" fill="#1a1a2a" opacity="0.2"/>
  <!-- Deep slash mark -->
  <path d="M16 100 L22 118" stroke="#1a1a2a" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M17 100 L23 118" stroke="#606068" stroke-width="0.5" fill="none" opacity="0.3"/>
  <!-- Rust -->
  <circle cx="18" cy="120" r="2" fill="#6a3a20" opacity="0.25"/>
  <circle cx="40" cy="40" r="1.5" fill="#6a3a20" opacity="0.2"/>
</svg>