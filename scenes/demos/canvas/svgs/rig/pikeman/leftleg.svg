  <line x1="24" y1="20" x2="36" y2="34" stroke="#606068" stroke-width="0.6" opacity="0.4"/>
  <ellipse cx="40" cy="100" rx="4" ry="3" fill="#1a1a2a" opacity="0.2"/>
  <line x1="18" y1="140" x2="22" y2="148" stroke="#606068" stroke-width="0.5" opacity="0.35"/>
