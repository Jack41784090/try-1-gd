  <rect x="46" y="27" width="6" height="7" rx="1" fill="#4a4a52" stroke="#0a0a0a" stroke-width="0.6"/>
  <rect x="46" y="67" width="6" height="7" rx="1" fill="#4a4a52" stroke="#0a0a0a" stroke-width="0.6"/>
  <!-- Sheen -->
  <path d="M48 6 Q54 12 56 40 L56 80" stroke="#72727a" stroke-width="1.5" fill="none" opacity="0.3"/>
  <!-- Shadow on far side -->
  <rect x="6" y="2" width="20" height="186" rx="6" fill="#0a0a0a" opacity="0.15"/>
