<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 192" width="64" height="192">
  <defs>
    <linearGradient id="llSteel" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="45%" stop-color="#3a3a42"/>
      <stop offset="100%" stop-color="#2a2a30"/>
    </linearGradient>
    <pattern id="llHatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(25)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#1a1a2a" stroke-width="0.4" opacity="0.25"/>
    </pattern>
    <pattern id="llHatch2" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-50)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#1a1a2a" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>
  <!-- Leather backing visible at edges -->
  <rect x="10" y="4" width="44" height="184" rx="10" fill="#2a1a10" stroke="#1a0f08" stroke-width="1"/>
  <!-- Main cuisse plate -->
  <path d="M8 8 Q8 2 16 2 L48 2 Q56 2 56 8 L58 168 Q58 180 48 186 L16 186 Q6 180 6 168Z" fill="url(#llSteel)" stroke="#0a0a0a" stroke-width="2"/>
  <path d="M8 8 Q8 2 16 2 L48 2 Q56 2 56 8 L58 168 Q58 180 48 186 L16 186 Q6 180 6 168Z" fill="url(#llHatch)"/>
  <path d="M8 8 Q8 2 16 2 L48 2 Q56 2 56 8 L58 168 Q58 180 48 186 L16 186 Q6 180 6 168Z" fill="url(#llHatch2)"/>
  <!-- Plate segments -->
  <path d="M10 40 Q32 44 54 40" stroke="#1a1a2a" stroke-width="1.2" fill="none"/>
  <path d="M8 80 Q32 84 56 80" stroke="#1a1a2a" stroke-width="1.2" fill="none"/>
  <path d="M8 120 Q32 124 56 120" stroke="#1a1a2a" stroke-width="1" fill="none"/>
  <path d="M8 160 Q32 164 56 160" stroke="#1a1a2a" stroke-width="1" fill="none"/>
  <!-- Knee cop (poleyn) at bottom -->
  <path d="M4 150 Q4 144 12 142 L52 142 Q60 144 60 150 L60 180 Q60 190 48 190 L16 190 Q4 190 4 180Z" fill="url(#llSteel)" stroke="#0a0a0a" stroke-width="2"/>
  <ellipse cx="32" cy="160" rx="20" ry="12" fill="#4a4a52" stroke="#0a0a0a" stroke-width="1.5"/>
  <ellipse cx="32" cy="160" rx="12" ry="7" fill="#3a3a42" stroke="#1a1a2a" stroke-width="0.8"/>
  <!-- Rivet line -->
  <circle cx="12" cy="12" r="1.5" fill="#4a4a52" stroke="#0a0a0a" stroke-width="0.7"/>
  <circle cx="52" cy="12" r="1.5" fill="#4a4a52" stroke="#0a0a0a" stroke-width="0.7"/>
  <circle cx="12" cy="50" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="52" cy="50" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="12" cy="90" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="52" cy="90" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="12" cy="130" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="52" cy="130" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <!-- Leather straps -->
  <rect x="10" y="28" width="44" height="5" rx="1" fill="#2a1a10" stroke="#1a0f08" stroke-width="0.8"/>
  <rect x="10" y="68" width="44" height="5" rx="1" fill="#2a1a10" stroke="#1a0f08" stroke-width="0.8"/>
  <rect x="10" y="108" width="44" height="5" rx="1" fill="#2a1a10" stroke="#1a0f08" stroke-width="0.8"/>
