<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 48" width="96" height="48">
  <defs>
    <linearGradient id="rfSteel" x1="1" y1="0" x2="0" y2="0.5">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="40%" stop-color="#4a4a52"/>
      <stop offset="100%" stop-color="#3a3a42"/>
    </linearGradient>
    <pattern id="rfHatch" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#1a1a2a" stroke-width="0.4" opacity="0.25"/>
    </pattern>
    <pattern id="rfHatch2" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#1a1a2a" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>
  <!-- Sole / base -->
  <path d="M88 36 Q92 36 92 32 L92 28 Q92 24 86 22 L14 18 Q4 18 4 24 L4 36 Q4 42 14 44 L76 44 Q88 44 88 36Z" fill="#1a1a22" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Main sabaton plates (mirrored) -->
  <path d="M86 8 Q86 2 76 2 L46 2 Q40 2 40 6 L40 30 Q40 38 50 40 L76 40 Q86 38 86 30Z" fill="url(#rfSteel)" stroke="#0a0a0a" stroke-width="2"/>
  <path d="M86 8 Q86 2 76 2 L46 2 Q40 2 40 6 L40 30 Q40 38 50 40 L76 40 Q86 38 86 30Z" fill="url(#rfHatch)"/>
  <!-- Toe plates -->
  <path d="M42 10 L18 8 Q10 8 8 14 L6 28 Q6 34 14 36 L40 36" fill="url(#rfSteel)" stroke="#0a0a0a" stroke-width="2"/>
  <path d="M42 10 L18 8 Q10 8 8 14 L6 28 Q6 34 14 36 L40 36" fill="url(#rfHatch2)"/>
  <!-- Steel toe cap -->
  <path d="M20 10 Q6 8 4 18 L4 30 Q6 36 14 36 L20 34" fill="#4a4a52" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Plate articulation lines -->
  <line x1="62" y1="4" x2="62" y2="38" stroke="#1a1a2a" stroke-width="1" opacity="0.6"/>
  <line x1="40" y1="8" x2="40" y2="36" stroke="#1a1a2a" stroke-width="1.2" opacity="0.7"/>
  <line x1="28" y1="10" x2="28" y2="34" stroke="#1a1a2a" stroke-width="1" opacity="0.6"/>
  <line x1="18" y1="10" x2="18" y2="34" stroke="#1a1a2a" stroke-width="0.8" opacity="0.5"/>
  <!-- Horizontal articulation -->
  <path d="M84 16 Q56 18 42 16" stroke="#1a1a2a" stroke-width="0.8" fill="none"/>
  <path d="M84 26 Q56 28 42 26" stroke="#1a1a2a" stroke-width="0.8" fill="none"/>
  <!-- Rivets -->
  <circle cx="80" cy="8" r="1.3" fill="#4a4a52" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="80" cy="20" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="80" cy="32" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="34" cy="14" r="1.2" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.5"/>
  <circle cx="34" cy="28" r="1.2" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.5"/>
  <!-- Sheen on near side -->
  <path d="M50 4 Q42 6 42 14" stroke="#72727a" stroke-width="1.2" fill="none" opacity="0.4"/>
  <path d="M14 12 Q10 16 10 24" stroke="#72727a" stroke-width="1" fill="none" opacity="0.35"/>
  <!-- Shadow on far side -->
  <rect x="66" y="2" width="20" height="38" rx="4" fill="#0a0a0a" opacity="0.12"/>
  <!-- Scratches -->
  <line x1="56" y1="8" x2="48" y2="18" stroke="#606068" stroke-width="0.5" opacity="0.4"/>
  <line x1="24" y1="16" x2="18" y2="26" stroke="#606068" stroke-width="0.5" opacity="0.35"/>
  <!-- Dent -->
  <ellipse cx="50" cy="26" rx="4" ry="2.5" fill="#1a1a2a" opacity="0.18"/>
  <!-- Rust -->
  <circle cx="52" cy="32" r="1.5" fill="#6a3a20" opacity="0.25"/>
  <circle cx="22" cy="22" r="1.2" fill="#6a3a20" opacity="0.2"/>
</svg>