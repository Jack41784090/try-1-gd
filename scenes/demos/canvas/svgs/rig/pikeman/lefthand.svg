<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="lhSteel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3a42"/>
      <stop offset="60%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#1a1a22"/>
    </linearGradient>
    <pattern id="lhHatch" patternUnits="userSpaceOnUse" width="3" height="3" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="3" stroke="#1a1a2a" stroke-width="0.3" opacity="0.3"/>
