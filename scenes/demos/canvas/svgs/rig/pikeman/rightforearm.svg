    <pattern id="rfaHatch2" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(50)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1a1a2a" stroke-width="0.3" opacity="0.15"/>
