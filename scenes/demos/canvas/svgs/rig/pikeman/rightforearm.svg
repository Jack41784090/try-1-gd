  <path d="M10 4 Q6 12 6 30 L6 56" stroke="#72727a" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M12 6 Q8 14 8 28" stroke="#8a8a92" stroke-width="0.8" fill="none" opacity="0.25"/>
