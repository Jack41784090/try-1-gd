  <circle cx="10" cy="8" r="1.3" fill="#4a4a52" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="38" cy="8" r="1.3" fill="#4a4a52" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="10" cy="46" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="38" cy="46" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="10" cy="82" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="38" cy="82" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
