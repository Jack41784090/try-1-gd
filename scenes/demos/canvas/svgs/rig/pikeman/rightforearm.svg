<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 104" width="48" height="104">
  <defs>
    <linearGradient id="rfaSteel" x1="1" y1="0" x2="0" y2="0.5">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="40%" stop-color="#4a4a52"/>
      <stop offset="100%" stop-color="#3a3a42"/>
    </linearGradient>
    <pattern id="rfaHatch" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(-35)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#1a1a2a" stroke-width="0.4" opacity="0.3"/>
