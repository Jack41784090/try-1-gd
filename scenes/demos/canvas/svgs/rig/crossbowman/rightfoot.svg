<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 48" width="96" height="48">
  <defs>
    <linearGradient id="rfootGrad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e1c10"/>
      <stop offset="50%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#4e3620"/>
    </linearGradient>
    <pattern id="rfootGrain" patternUnits="userSpaceOnUse" width="4" height="4">
      <circle cx="2" cy="2" r="0.3" fill="#0a0a0a" opacity="0.12"/>
      <circle cx="3" cy="3" r="0.2" fill="#0a0a0a" opacity="0.08"/>
    </pattern>
    <pattern id="rfootHatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#0a0a0a" stroke-width="0.5" opacity="0.12"/>
    </pattern>
  </defs>
  <!-- Sole -->
  <path d="M8 38 Q4 42 10 46 L80 46 Q92 44 90 38Z" fill="#1a1008" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Boot body -->
  <path d="M6 10 Q4 20 6 34 L8 38 L88 38 Q92 30 90 14 Q86 4 70 2 L24 2 Q10 4 6 10Z" fill="url(#rfootGrad)" stroke="#0a0a0a" stroke-width="2.5"/>
  <!-- Leather grain -->
  <path d="M6 10 Q4 20 6 34 L8 38 L88 38 Q92 30 90 14 Q86 4 70 2 L24 2 Q10 4 6 10Z" fill="url(#rfootGrain)"/>
  <!-- Toe cap seam -->
  <path d="M70 4 Q76 20 74 36" stroke="#2a1c10" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- Heel reinforcement -->
  <path d="M6 10 Q8 8 12 10 L14 36 L6 34Z" fill="#2e1c10" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Lighter shadow (right foot gets more light) -->
  <path d="M60 4 Q80 4 90 14 Q92 30 88 38 L68 38 L66 4Z" fill="#0a0a0a" opacity="0.08"/>
  <path d="M60 4 Q80 4 90 14 Q92 30 88 38 L68 38 L66 4Z" fill="url(#rfootHatch)"/>
  <!-- Ankle cuff -->
  <path d="M10 4 Q40 -2 76 4" stroke="#4e3620" stroke-width="3" fill="none"/>
  <path d="M10 4 Q40 -2 76 4" stroke="#3a2818" stroke-width="1.5" fill="none"/>
  <!-- Ankle stitching -->
  <path d="M14 6 Q40 0 72 6" stroke="#2a1c10" stroke-width="0.6" stroke-dasharray="1.5,2" fill="none" opacity="0.4"/>
  <!-- Lacing detail -->
  <path d="M36 4 L40 10 L44 4 L48 10 L52 4" stroke="#2a1c10" stroke-width="1" fill="none" opacity="0.5"/>
  <!-- Sole edge stitching -->
  <path d="M12 38 L84 38" stroke="#1a1008" stroke-width="0.6" stroke-dasharray="1.5,2" opacity="0.4"/>
  <!-- Subtle highlight on upper surface -->
  <ellipse cx="50" cy="16" rx="18" ry="8" fill="#4e3620" opacity="0.08"/>
  <!-- Wear on toe -->
  <ellipse cx="80" cy="24" rx="6" ry="8" fill="#4e3620" opacity="0.12"/>
  <!-- Crease lines -->
  <path d="M54 12 Q58 18 54 24" stroke="#2a1c10" stroke-width="0.8" fill="none" opacity="0.3"/>
  <path d="M60 10 Q64 16 60 22" stroke="#2a1c10" stroke-width="0.6" fill="none" opacity="0.25"/>
</svg>
