<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 104" width="48" height="104">
  <defs>
    <linearGradient id="lfBracerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2e1c10"/>
      <stop offset="50%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#4e3620"/>
    </linearGradient>
    <pattern id="lfGrain" patternUnits="userSpaceOnUse" width="5" height="5">
      <circle cx="2" cy="2" r="0.35" fill="#0a0a0a" opacity="0.12"/>
      <circle cx="4" cy="4" r="0.25" fill="#0a0a0a" opacity="0.08"/>
    </pattern>
    <pattern id="lfHatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#0a0a0a" stroke-width="0.5" opacity="0.2"/>
    </pattern>
  </defs>
  <!-- Base forearm shape -->
  <rect x="4" y="0" width="40" height="104" rx="10" fill="#1a3018" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Heavy leather bracer — full coverage for crossbow use -->
  <rect x="2" y="8" width="44" height="88" rx="10" fill="url(#lfBracerGrad)" stroke="#0a0a0a" stroke-width="2.5"/>
  <!-- Leather grain -->
  <rect x="2" y="8" width="44" height="88" rx="10" fill="url(#lfGrain)"/>
  <!-- Shadow side -->
  <rect x="2" y="8" width="14" height="88" rx="8" fill="#0a0a0a" opacity="0.2"/>
  <rect x="2" y="8" width="14" height="88" rx="8" fill="url(#lfHatch)"/>
  <!-- Multiple straps -->
  <rect x="0" y="14" width="48" height="7" rx="2" fill="#4e3620" stroke="#0a0a0a" stroke-width="1.2"/>
  <rect x="0" y="32" width="48" height="7" rx="2" fill="#4e3620" stroke="#0a0a0a" stroke-width="1.2"/>
  <rect x="0" y="50" width="48" height="7" rx="2" fill="#4e3620" stroke="#0a0a0a" stroke-width="1.2"/>
  <rect x="0" y="68" width="48" height="7" rx="2" fill="#4e3620" stroke="#0a0a0a" stroke-width="1.2"/>
  <rect x="0" y="84" width="48" height="7" rx="2" fill="#4e3620" stroke="#0a0a0a" stroke-width="1.2"/>
  <!-- Brass rivets on each strap -->
  <circle cx="36" cy="17.5" r="2" fill="#8a7a40" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="36" cy="35.5" r="2" fill="#8a7a40" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="36" cy="53.5" r="2" fill="#8a7a40" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="36" cy="71.5" r="2" fill="#8a7a40" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="36" cy="87.5" r="2" fill="#8a7a40" stroke="#0a0a0a" stroke-width="0.8"/>
  <!-- Rivet inner dots -->
  <circle cx="36" cy="17.5" r="0.8" fill="#6a5a30"/>
  <circle cx="36" cy="35.5" r="0.8" fill="#6a5a30"/>
  <circle cx="36" cy="53.5" r="0.8" fill="#6a5a30"/>
  <circle cx="36" cy="71.5" r="0.8" fill="#6a5a30"/>
  <circle cx="36" cy="87.5" r="0.8" fill="#6a5a30"/>
  <!-- Center seam stitching -->
  <line x1="24" y1="10" x2="24" y2="94" stroke="#2a1c10" stroke-width="0.8" stroke-dasharray="2,2.5" opacity="0.4"/>
  <!-- Reinforced wrist guard -->
  <rect x="4" y="90" width="40" height="12" rx="6" fill="#2e1c10" stroke="#0a0a0a" stroke-width="1.5"/>
  <path d="M8 93 L40 93" stroke="#3a2818" stroke-width="0.8" opacity="0.5"/>
  <!-- Wear/scuff marks -->
  <path d="M14 40 L18 42" stroke="#5a4430" stroke-width="0.6" opacity="0.3"/>
  <path d="M16 60 L20 58" stroke="#5a4430" stroke-width="0.6" opacity="0.3"/>
  <path d="M22 76 L26 78" stroke="#5a4430" stroke-width="0.6" opacity="0.3"/>
</svg>
