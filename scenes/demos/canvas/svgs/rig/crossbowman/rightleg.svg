<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 192" width="64" height="192">
  <defs>
    <linearGradient id="rlegGrad" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#0f1e0d"/>
      <stop offset="40%" stop-color="#1a3018"/>
      <stop offset="100%" stop-color="#2a4422"/>
    </linearGradient>
    <pattern id="rlegHatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(-35)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#0a0a0a" stroke-width="0.5" opacity="0.12"/>
    </pattern>
    <pattern id="rlegGrain" patternUnits="userSpaceOnUse" width="5" height="5">
      <circle cx="3" cy="3" r="0.3" fill="#0a0a0a" opacity="0.1"/>
    </pattern>
  </defs>
  <!-- Breeches base -->
  <path d="M8 0 L4 192 L60 192 L56 0Z" fill="url(#rlegGrad)" stroke="#0a0a0a" stroke-width="2.5"/>
  <!-- Fabric folds -->
  <path d="M44 20 Q40 50 46 80" stroke="#0f1e0d" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M38 60 Q34 90 40 120" stroke="#0f1e0d" stroke-width="1.2" fill="none" opacity="0.3"/>
  <path d="M20 15 Q24 45 18 75" stroke="#2a4422" stroke-width="1" fill="none" opacity="0.25"/>
  <path d="M30 100 Q26 130 32 160" stroke="#0f1e0d" stroke-width="1.2" fill="none" opacity="0.3"/>
  <!-- Shadow side (right, lighter) -->
  <path d="M42 0 L46 192 L60 192 L56 0Z" fill="#0a0a0a" opacity="0.1"/>
  <path d="M42 0 L46 192 L60 192 L56 0Z" fill="url(#rlegHatch)"/>
  <!-- Leather knee patch -->
  <ellipse cx="32" cy="100" rx="22" ry="28" fill="#3a2818" stroke="#0a0a0a" stroke-width="2"/>
  <ellipse cx="32" cy="100" rx="22" ry="28" fill="url(#rlegGrain)"/>
  <!-- Knee patch stitching -->
  <ellipse cx="32" cy="100" rx="18" ry="24" fill="none" stroke="#2a1c10" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.4"/>
  <!-- Knee patch shadow -->
  <ellipse cx="38" cy="104" rx="10" ry="18" fill="#0a0a0a" opacity="0.1"/>
  <!-- Reinforcement straps -->
  <rect x="6" y="78" width="52" height="6" rx="2" fill="#4e3620" stroke="#0a0a0a" stroke-width="1"/>
  <rect x="6" y="118" width="52" height="6" rx="2" fill="#4e3620" stroke="#0a0a0a" stroke-width="1"/>
  <!-- Buckles -->
  <rect x="12" y="76" width="8" height="8" rx="1.5" fill="#8a7a40" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="16" cy="80" r="1.2" fill="#6a5a30"/>
  <rect x="12" y="116" width="8" height="8" rx="1.5" fill="#8a7a40" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="16" cy="120" r="1.2" fill="#6a5a30"/>
  <!-- Thigh crease -->
  <path d="M20 10 Q30 16 42 10" stroke="#0f1e0d" stroke-width="1.5" fill="none" opacity="0.3"/>
  <!-- Highlight strip -->
  <rect x="24" y="20" width="8" height="50" rx="4" fill="#2a4422" opacity="0.1"/>
  <!-- Wear marks -->
  <path d="M30 50 L34 52" stroke="#2a4422" stroke-width="0.5" opacity="0.3"/>
  <path d="M28 140 L32 138" stroke="#2a4422" stroke-width="0.5" opacity="0.3"/>
</svg>
