<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" width="160" height="48">
  <defs>
    <linearGradient id="beltGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="40%" stop-color="#4e3620"/>
      <stop offset="100%" stop-color="#2e1c10"/>
    </linearGradient>
    <pattern id="beltGrain" patternUnits="userSpaceOnUse" width="6" height="6">
      <circle cx="3" cy="3" r="0.4" fill="#0a0a0a" opacity="0.1"/>
      <circle cx="1" cy="5" r="0.3" fill="#0a0a0a" opacity="0.08"/>
    </pattern>
  </defs>
  <!-- Base fabric (dark green breeches top) -->
  <rect x="4" y="20" width="152" height="28" rx="4" fill="#1a3018" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Wide leather belt -->
  <rect x="2" y="2" width="156" height="24" rx="4" fill="url(#beltGrad)" stroke="#0a0a0a" stroke-width="2.5"/>
  <!-- Belt leather grain -->
  <rect x="2" y="2" width="156" height="24" rx="4" fill="url(#beltGrain)"/>
  <!-- Belt stitching top edge -->
  <line x1="8" y1="6" x2="152" y2="6" stroke="#5a4430" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.4"/>
  <!-- Belt stitching bottom edge -->
  <line x1="8" y1="22" x2="152" y2="22" stroke="#5a4430" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.4"/>
  <!-- Central brass buckle -->
  <rect x="68" y="4" width="24" height="20" rx="3" fill="#8a7a40" stroke="#0a0a0a" stroke-width="1.5"/>
  <rect x="72" y="8" width="16" height="12" rx="2" fill="none" stroke="#6a5a30" stroke-width="1.5"/>
  <line x1="80" y1="6" x2="80" y2="22" stroke="#6a5a30" stroke-width="1.5"/>
  <circle cx="76" cy="14" r="1.2" fill="#6a5a30"/>
  <!-- Left pouch -->
  <rect x="16" y="8" width="20" height="16" rx="3" fill="#3a2818" stroke="#0a0a0a" stroke-width="1.5"/>
  <path d="M18 14 L34 14" stroke="#4e3620" stroke-width="1" opacity="0.6"/>
  <rect x="24" y="8" width="4" height="3" rx="1" fill="#8a7a40" stroke="#0a0a0a" stroke-width="0.6"/>
  <!-- Right pouch -->
  <rect x="124" y="8" width="20" height="16" rx="3" fill="#3a2818" stroke="#0a0a0a" stroke-width="1.5"/>
  <path d="M126 14 L142 14" stroke="#4e3620" stroke-width="1" opacity="0.6"/>
  <rect x="132" y="8" width="4" height="3" rx="1" fill="#8a7a40" stroke="#0a0a0a" stroke-width="0.6"/>
  <!-- Tool loops -->
  <rect x="48" y="10" width="6" height="12" rx="1" fill="none" stroke="#3a2818" stroke-width="1.8"/>
  <rect x="106" y="10" width="6" height="12" rx="1" fill="none" stroke="#3a2818" stroke-width="1.8"/>
  <!-- Small brass rivets -->
  <circle cx="58" cy="14" r="1.2" fill="#8a7a40" stroke="#0a0a0a" stroke-width="0.5"/>
  <circle cx="102" cy="14" r="1.2" fill="#8a7a40" stroke="#0a0a0a" stroke-width="0.5"/>
  <!-- Left shadow -->
  <rect x="2" y="2" width="30" height="24" rx="4" fill="#0a0a0a" opacity="0.15"/>
  <!-- Shadow on fabric below belt -->
  <rect x="4" y="20" width="152" height="8" fill="#0a0a0a" opacity="0.15"/>
  <!-- Fabric crease lines -->
  <path d="M40 30 L42 44" stroke="#0f1e0d" stroke-width="1" opacity="0.3"/>
  <path d="M80 28 L80 44" stroke="#0f1e0d" stroke-width="1" opacity="0.3"/>
  <path d="M120 30 L118 44" stroke="#0f1e0d" stroke-width="1" opacity="0.3"/>
</svg>
