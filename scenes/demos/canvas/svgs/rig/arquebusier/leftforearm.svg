<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 104" width="48" height="104">
  <defs>
    <linearGradient id="forearmGradL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a1a14"/>
      <stop offset="50%" stop-color="#3a2a20"/>
      <stop offset="100%" stop-color="#2a2018"/>
    </linearGradient>
    <linearGradient id="forearmShadL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Forearm sleeve - narrowing to cuff -->
  <path d="M6 2 Q24 0 42 2 Q44 4 43 8 L40 92 Q38 100 24 102 Q10 100 8 92 L5 8 Q4 4 6 2Z" fill="url(#forearmGradL)" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Shadow side -->
  <path d="M4 4 L8 92 Q10 100 16 102 L12 2 Q8 2 4 4Z" fill="url(#forearmShadL)"/>
  <!-- Cuff - slightly flared -->
  <path d="M8 90 Q24 86 40 90 Q42 96 40 100 Q24 104 8 100 Q6 96 8 90Z" fill="#2a1a14" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Cuff brass button -->
  <circle cx="34" cy="95" r="2.5" fill="#7a6a30" stroke="#0a0a0a" stroke-width="1"/>
  <circle cx="34" cy="95" r="1" fill="#9a8a40" opacity="0.5"/>
  <!-- Cuff stitching -->
  <path d="M12 92 Q24 89 36 92" stroke="#4a3a28" stroke-width="0.6" stroke-dasharray="2,2" fill="none" opacity="0.4"/>
  <!-- Powder burn marks - orange-brown spots -->
  <circle cx="20" cy="30" r="3" fill="#8a4a20" opacity="0.2"/>
  <circle cx="32" cy="50" r="2.5" fill="#8a4a20" opacity="0.15"/>
  <circle cx="16" cy="65" r="2" fill="#8a4a20" opacity="0.18"/>
  <circle cx="28" cy="42" r="1.5" fill="#6a3a18" opacity="0.12"/>
  <!-- Fabric creases -->
  <path d="M14 20 Q20 28 16 40" stroke="#1a1210" stroke-width="0.7" fill="none" opacity="0.25"/>
  <path d="M34 25 Q28 38 32 55" stroke="#1a1210" stroke-width="0.6" fill="none" opacity="0.2"/>
  <path d="M12 55 Q20 62 16 75" stroke="#1a1210" stroke-width="0.6" fill="none" opacity="0.2"/>
  <!-- Cross-hatching in shadow -->
  <line x1="8" y1="15" x2="12" y2="35" stroke="#1a1210" stroke-width="0.4" opacity="0.18"/>
  <line x1="9" y1="40" x2="13" y2="60" stroke="#1a1210" stroke-width="0.4" opacity="0.15"/>
  <line x1="8" y1="65" x2="12" y2="85" stroke="#1a1210" stroke-width="0.4" opacity="0.12"/>
  <!-- Soot stain -->
  <ellipse cx="24" cy="72" rx="8" ry="5" fill="#1a1210" opacity="0.1" transform="rotate(-5 24 72)"/>
</svg>
