  <!-- Light catch -->
  <path d="M16 8 Q22 4 28 8 L26 50 Q22 46 18 50Z" fill="#4a3a28" opacity="0.1"/>
  <!-- Cuff -->
  <path d="M8 90 Q24 86 40 90 Q42 96 40 100 Q24 104 8 100 Q6 96 8 90Z" fill="#2a1a14" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Cuff brass button -->
  <circle cx="14" cy="95" r="2.5" fill="#7a6a30" stroke="#0a0a0a" stroke-width="1"/>
  <circle cx="14" cy="95" r="1" fill="#9a8a40" opacity="0.5"/>
  <!-- Cuff stitching -->
  <path d="M12 92 Q24 89 36 92" stroke="#4a3a28" stroke-width="0.6" stroke-dasharray="2,2" fill="none" opacity="0.4"/>
  <!-- Powder burn marks -->
  <circle cx="28" cy="28" r="3" fill="#8a4a20" opacity="0.18"/>
  <circle cx="16" cy="48" r="2.5" fill="#8a4a20" opacity="0.15"/>
  <circle cx="30" cy="60" r="2" fill="#8a4a20" opacity="0.16"/>
  <circle cx="20" cy="38" r="1.5" fill="#6a3a18" opacity="0.1"/>
  <!-- Fabric creases -->
  <path d="M34 18 Q28 26 32 42" stroke="#1a1210" stroke-width="0.7" fill="none" opacity="0.22"/>
  <path d="M14 30 Q22 40 18 58" stroke="#1a1210" stroke-width="0.6" fill="none" opacity="0.18"/>
  <path d="M36 58 Q28 66 34 80" stroke="#1a1210" stroke-width="0.6" fill="none" opacity="0.18"/>
  <!-- Cross-hatching -->
  <line x1="36" y1="15" x2="40" y2="35" stroke="#1a1210" stroke-width="0.4" opacity="0.15"/>
  <line x1="38" y1="45" x2="40" y2="65" stroke="#1a1210" stroke-width="0.4" opacity="0.12"/>
  <line x1="36" y1="68" x2="40" y2="88" stroke="#1a1210" stroke-width="0.4" opacity="0.1"/>
  <!-- Soot stain -->
  <ellipse cx="24" cy="75" rx="7" ry="4" fill="#1a1210" opacity="0.08" transform="rotate(5 24 75)"/>
