<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 104" width="48" height="104">
  <defs>
    <linearGradient id="forearmGradR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a2a20"/>
      <stop offset="50%" stop-color="#4a3828"/>
      <stop offset="100%" stop-color="#3a2a20"/>
    </linearGradient>
    <linearGradient id="forearmShadR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Forearm sleeve -->
  <path d="M6 2 Q24 0 42 2 Q44 4 43 8 L40 92 Q38 100 24 102 Q10 100 8 92 L5 8 Q4 4 6 2Z" fill="url(#forearmGradR)" stroke="#0a0a0a" stroke-width="2"/>
