<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" width="160" height="48">
  <defs>
    <linearGradient id="beltGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2a20"/>
      <stop offset="50%" stop-color="#2a1a14"/>
      <stop offset="100%" stop-color="#1a1210"/>
    </linearGradient>
    <pattern id="leatherGrain" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.5" fill="#1a1210" opacity="0.15"/>
    </pattern>
  </defs>
  <!-- Belt base -->
  <rect x="8" y="4" width="144" height="20" rx="4" fill="url(#beltGrad)" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Leather grain texture -->
  <rect x="8" y="4" width="144" height="20" rx="4" fill="url(#leatherGrain)"/>
  <!-- Belt shadow -->
  <rect x="8" y="18" width="144" height="6" rx="2" fill="#000000" opacity="0.2"/>
  <!-- Main buckle - gunmetal -->
  <rect x="68" y="4" width="24" height="20" rx="2" fill="#4a4a50" stroke="#0a0a0a" stroke-width="1.5"/>
  <rect x="72" y="7" width="16" height="14" rx="1" fill="#1a1a1a"/>
  <!-- Buckle prong -->
  <line x1="80" y1="6" x2="80" y2="22" stroke="#5a5a60" stroke-width="2"/>
  <!-- Buckle highlight -->
  <line x1="70" y1="6" x2="90" y2="6" stroke="#6a6a70" stroke-width="0.8" opacity="0.4"/>
  <!-- Powder flask - left side -->
  <path d="M18 8 Q14 8 12 14 Q10 22 12 28 Q14 34 18 36 Q24 36 26 28 Q28 22 26 14 Q24 8 18 8Z" fill="#3a2a1a" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Flask cap -->
  <rect x="14" y="4" width="8" height="5" rx="2" fill="#7a6a30" stroke="#0a0a0a" stroke-width="1"/>
  <!-- Flask nozzle -->
  <rect x="16" y="0" width="4" height="5" rx="1" fill="#4a4a50" stroke="#0a0a0a" stroke-width="0.8"/>
  <!-- Flask shadow -->
  <path d="M14 14 Q12 20 14 28" stroke="#1a1210" stroke-width="1" fill="none" opacity="0.3"/>
  <!-- Tool pouch - right side -->
  <rect x="120" y="10" width="22" height="28" rx="3" fill="#2a1a14" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Pouch flap -->
  <path d="M120 10 Q120 18 131 20 Q142 18 142 10" fill="#3a2a1a" stroke="#0a0a0a" stroke-width="1"/>
  <!-- Pouch button -->
  <circle cx="131" cy="18" r="2" fill="#7a6a30" stroke="#0a0a0a" stroke-width="0.8"/>
  <!-- Pouch shadow -->
  <rect x="122" y="22" width="18" height="12" rx="2" fill="#000000" opacity="0.15"/>
  <!-- Matchcord holder - far right -->
  <rect x="144" y="6" width="8" height="30" rx="2" fill="#3a2a20" stroke="#0a0a0a" stroke-width="1"/>
  <!-- Matchcord coil peeking out -->
  <path d="M146 10 Q150 8 152 12 Q150 16 148 14" stroke="#8a7a50" stroke-width="1.5" fill="none"/>
  <!-- Waist fabric below belt -->
  <path d="M12 24 Q80 28 148 24 L148 46 Q80 48 12 46Z" fill="#2a2018" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Fabric shadow -->
  <path d="M20 30 Q80 34 140 30" stroke="#1a1210" stroke-width="0.8" fill="none" opacity="0.25"/>
  <!-- Belt stitching -->
  <line x1="30" y1="13" x2="65" y2="13" stroke="#4a3a28" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.4"/>
  <line x1="95" y1="13" x2="118" y2="13" stroke="#4a3a28" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.4"/>
</svg>
