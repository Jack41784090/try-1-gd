  <rect x="132" y="22" width="10" height="14" rx="2" fill="#3a2a1a" stroke="#0a0a0a" stroke-width="1" transform="rotate(-20 137 29)"/>
  <rect x="120" y="42" width="10" height="14" rx="2" fill="#3a2a1a" stroke="#0a0a0a" stroke-width="1" transform="rotate(-20 125 49)"/>
  <rect x="108" y="62" width="10" height="14" rx="2" fill="#3a2a1a" stroke="#0a0a0a" stroke-width="1" transform="rotate(-20 113 69)"/>
  <rect x="94" y="82" width="10" height="14" rx="2" fill="#3a2a1a" stroke="#0a0a0a" stroke-width="1" transform="rotate(-20 99 89)"/>
  <rect x="80" y="102" width="10" height="14" rx="2" fill="#3a2a1a" stroke="#0a0a0a" stroke-width="1" transform="rotate(-20 85 109)"/>
  <rect x="66" y="122" width="10" height="14" rx="2" fill="#3a2a1a" stroke="#0a0a0a" stroke-width="1" transform="rotate(-20 71 129)"/>
