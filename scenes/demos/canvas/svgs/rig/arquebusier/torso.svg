  <line x1="132" y1="24" x2="142" y2="24" stroke="#7a6a30" stroke-width="1" transform="rotate(-20 137 24)"/>
  <line x1="120" y1="44" x2="130" y2="44" stroke="#7a6a30" stroke-width="1" transform="rotate(-20 125 44)"/>
  <line x1="108" y1="64" x2="118" y2="64" stroke="#7a6a30" stroke-width="1" transform="rotate(-20 113 64)"/>
  <line x1="94" y1="84" x2="104" y2="84" stroke="#7a6a30" stroke-width="1" transform="rotate(-20 99 84)"/>
  <line x1="80" y1="104" x2="90" y2="104" stroke="#7a6a30" stroke-width="1" transform="rotate(-20 85 104)"/>
  <!-- Soot marks - dark smudges -->
  <ellipse cx="60" cy="50" rx="12" ry="8" fill="#1a1210" opacity="0.12" transform="rotate(-10 60 50)"/>
  <ellipse cx="140" cy="90" rx="10" ry="6" fill="#1a1210" opacity="0.1" transform="rotate(15 140 90)"/>
  <ellipse cx="80" cy="140" rx="14" ry="7" fill="#1a1210" opacity="0.1" transform="rotate(-5 80 140)"/>
  <ellipse cx="50" cy="100" rx="8" ry="5" fill="#1a1210" opacity="0.08"/>
  <!-- Powder burn marks -->
  <circle cx="130" cy="60" r="3" fill="#8a4a20" opacity="0.15"/>
  <circle cx="55" cy="80" r="2" fill="#8a4a20" opacity="0.12"/>
  <circle cx="120" cy="130" r="2.5" fill="#8a4a20" opacity="0.1"/>
  <!-- Fabric creases -->
  <path d="M50 30 Q60 50 55 80" stroke="#1a1210" stroke-width="0.8" fill="none" opacity="0.25"/>
  <path d="M140 30 Q132 50 136 80" stroke="#1a1210" stroke-width="0.8" fill="none" opacity="0.2"/>
  <path d="M40 100 Q60 110 50 140" stroke="#1a1210" stroke-width="0.8" fill="none" opacity="0.2"/>
  <path d="M150 100 Q135 110 142 140" stroke="#1a1210" stroke-width="0.8" fill="none" opacity="0.18"/>
  <!-- Bottom hem wear -->
  <path d="M20 168 Q50 172 96 174 Q140 172 172 168" stroke="#1a1210" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M24 170 Q30 174 40 170" stroke="#2a1a14" stroke-width="0.5" fill="none" opacity="0.3"/>
  <path d="M140 170 Q150 174 160 170" stroke="#2a1a14" stroke-width="0.5" fill="none" opacity="0.3"/>
</svg>
