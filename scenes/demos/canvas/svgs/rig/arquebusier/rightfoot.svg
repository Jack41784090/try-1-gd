<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 48" width="96" height="48">
  <defs>
    <linearGradient id="bootGradR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="60%" stop-color="#2a1a14"/>
      <stop offset="100%" stop-color="#1a1210"/>
    </linearGradient>
    <linearGradient id="bootShadR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <!-- Boot sole -->
  <path d="M16 40 Q50 44 86 40 Q92 40 94 38 L94 44 Q92 48 86 46 Q50 48 16 46 Q8 46 6 44 L6 38 Q8 40 16 40Z" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="1"/>
