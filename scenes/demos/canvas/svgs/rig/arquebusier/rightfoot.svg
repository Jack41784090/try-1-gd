  <path d="M8 28 Q8 18 20 12 Q36 6 56 10 L54 34 Q36 38 14 34 Q8 32 8 28Z" fill="#2a1a10" stroke="#0a0a0a" stroke-width="1.5" opacity="0.55"/>
  <!-- Toe seam -->
  <path d="M56 10 Q54 22 54 34" stroke="#1a1210" stroke-width="1" fill="none" opacity="0.25"/>
  <!-- Heel -->
  <path d="M78 30 Q84 28 88 30 L90 38 Q88 42 86 42 Q80 42 78 38Z" fill="#1a1210" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Spur nub -->
  <circle cx="90" cy="36" r="2.5" fill="#4a4a50" stroke="#0a0a0a" stroke-width="1"/>
  <circle cx="90" cy="36" r="1" fill="#6a6a70" opacity="0.5"/>
  <!-- Boot top -->
  <path d="M20 6 Q50 2 78 6" stroke="#3a2818" stroke-width="2" fill="none"/>
  <!-- Ankle padding -->
  <path d="M20 6 Q20 12 26 14 Q46 8 66 12 Q74 12 78 6" fill="#3a2818" stroke="#0a0a0a" stroke-width="1" opacity="0.35"/>
  <!-- Leather creases -->
  <path d="M26 18 Q34 22 28 30" stroke="#1a1210" stroke-width="0.7" fill="none" opacity="0.22"/>
  <path d="M42 14 Q48 20 44 28" stroke="#1a1210" stroke-width="0.6" fill="none" opacity="0.18"/>
  <path d="M62 16 Q66 22 62 30" stroke="#1a1210" stroke-width="0.6" fill="none" opacity="0.16"/>
