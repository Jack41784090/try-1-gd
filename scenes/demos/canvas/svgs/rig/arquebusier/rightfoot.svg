  <ellipse cx="36" cy="32" rx="5" ry="3" fill="#3a2a18" opacity="0.12"/>
  <ellipse cx="56" cy="28" rx="4" ry="2" fill="#3a2a18" opacity="0.1"/>
  <!-- Cross-hatching -->
  <line x1="12" y1="22" x2="20" y2="36" stroke="#0a0a0a" stroke-width="0.4" opacity="0.18"/>
  <line x1="18" y1="20" x2="26" y2="34" stroke="#0a0a0a" stroke-width="0.4" opacity="0.12"/>
  <!-- Stitching -->
  <path d="M20 14 Q50 10 78 14" stroke="#4a3a28" stroke-width="0.5" stroke-dasharray="2,3" fill="none" opacity="0.28"/>
</svg>
