<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 48" width="96" height="48">
  <defs>
    <linearGradient id="rfGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#2a2018"/>
    </linearGradient>
    <pattern id="rfHatch" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#0a0a0a" stroke-width="0.4" opacity="0.3"/>
    </pattern>
  </defs>
  <!-- Sandal sole -->
  <path d="M8 38 Q20 44 48 46 Q76 44 84 38 L86 42 Q76 48 48 48 Q20 48 10 42 Z" fill="#1a1410" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Cloth-wrapped foot base (mirrored) -->
  <path d="M86 12 Q82 4 66 2 Q46 0 28 2 Q14 4 8 12 L6 30 Q8 40 18 44 Q36 48 56 48 Q76 48 84 44 Q90 40 90 30 Z" fill="url(#rfGrad)" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Cross-hatching on right -->
  <path d="M28 2 Q46 0 66 2 Q82 4 86 12 L90 30 Q90 40 84 44 Q76 48 56 48 L56 0 Z" fill="url(#rfHatch)" opacity="0.3"/>
  <!-- Leather strap across — front -->
  <path d="M76 10 Q66 16 48 18 Q30 16 20 10" stroke="#4a3a28" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M76 10 Q66 16 48 18 Q30 16 20 10" stroke="#5a4a38" stroke-width="1" fill="none" opacity="0.4"/>
  <!-- Leather strap across — middle -->
  <path d="M82 24 Q68 30 48 32 Q28 30 14 24" stroke="#4a3a28" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M82 24 Q68 30 48 32 Q28 30 14 24" stroke="#5a4a38" stroke-width="1" fill="none" opacity="0.4"/>
  <!-- Vertical strap connecting -->
  <path d="M62 14 L64 28" stroke="#4a3a28" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M34 14 L32 28" stroke="#4a3a28" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Cloth wrapping texture -->
  <path d="M78 8 Q72 6 64 6" stroke="#2a2018" stroke-width="0.6" fill="none" opacity="0.5"/>
  <path d="M74 18 Q62 22 46 24" stroke="#2a2018" stroke-width="0.6" fill="none" opacity="0.4"/>
  <path d="M80 34 Q66 38 46 40 Q26 38 14 34" stroke="#2a2018" stroke-width="0.6" fill="none" opacity="0.4"/>
  <!-- Toe area -->
  <path d="M14 14 Q10 18 8 26 Q8 32 10 36" stroke="#1a1410" stroke-width="1" fill="none" opacity="0.5"/>
  <!-- Shadow on inner side -->
  <path d="M86 12 L90 30 Q90 40 84 44 Q80 46 72 48 L72 4 Q78 6 86 12 Z" fill="#0a1020" opacity="0.18"/>
  <!-- Strap buckle -->
  <rect x="46" y="8" width="4" height="4" rx="1" fill="#6a5a40" stroke="#0a0a0a" stroke-width="0.8"/>
  <!-- Light highlight near side -->
  <path d="M18 10 Q14 18 12 28 Q12 36 16 42" stroke="#4a3a28" stroke-width="0.5" fill="none" opacity="0.3"/>
  <!-- Outline reinforcement -->
  <path d="M86 12 Q82 4 66 2 Q46 0 28 2 Q14 4 8 12 L6 30 Q8 40 18 44 Q36 48 56 48 Q76 48 84 44 Q90 40 90 30 Z" fill="none" stroke="#0a0a0a" stroke-width="2"/>
</svg>
