<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 144" width="56" height="144">
  <defs>
    <linearGradient id="lsGrad" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#0e1830"/>
      <stop offset="40%" stop-color="#182840"/>
      <stop offset="100%" stop-color="#1a2a4a"/>
    </linearGradient>
    <linearGradient id="lsShadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a1020" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a1020" stop-opacity="0"/>
    </linearGradient>
    <pattern id="lsHatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(48)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#0a1020" stroke-width="0.5" opacity="0.2"/>
    </pattern>
  </defs>
  <!-- Lower robe — slightly lighter where fabric thins -->
  <path d="M6 4 Q14 0 28 0 Q42 0 50 4 L52 35 Q54 70 52 105 L48 132 Q42 144 28 144 Q14 144 6 132 L4 105 Q2 70 4 35 Z" fill="url(#lsGrad)" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Cross-hatching -->
  <path d="M6 4 Q14 0 28 0 L28 144 Q14 144 6 132 L4 105 Q2 70 4 35 Z" fill="url(#lsHatch)" opacity="0.35"/>
  <!-- Shadow overlay -->
  <path d="M6 4 L4 35 Q2 70 4 105 L6 132 Q8 138 14 142 L14 0 Q14 0 6 4 Z" fill="url(#lsShadow)"/>
  <!-- Vertical fold lines -->
  <path d="M14 6 Q16 35 14 70 Q12 105 14 138" stroke="#0e1830" stroke-width="1" fill="none" opacity="0.45"/>
  <path d="M24 4 Q26 35 24 70 Q22 105 24 142" stroke="#0e1830" stroke-width="0.8" fill="none" opacity="0.35"/>
  <path d="M36 4 Q38 35 36 70 Q34 105 36 142" stroke="#0e1830" stroke-width="0.8" fill="none" opacity="0.35"/>
  <path d="M44 6 Q46 35 44 70 Q42 105 44 138" stroke="#0e1830" stroke-width="0.8" fill="none" opacity="0.3"/>
  <!-- Horizontal drape lines -->
  <path d="M6 30 Q18 28 32 30 Q44 32 50 34" stroke="#0e1830" stroke-width="0.5" fill="none" opacity="0.25"/>
  <path d="M6 70 Q18 68 32 70 Q44 72 50 74" stroke="#0e1830" stroke-width="0.5" fill="none" opacity="0.2"/>
  <!-- Cloth wrapping suggestion at bottom -->
  <path d="M8 120 Q14 118 28 118 Q42 118 48 120" stroke="#243660" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M10 126 Q14 124 28 124 Q42 124 46 126" stroke="#243660" stroke-width="0.8" fill="none" opacity="0.35"/>
  <path d="M12 132 Q18 130 28 130 Q38 130 44 132" stroke="#243660" stroke-width="0.6" fill="none" opacity="0.3"/>
  <!-- Wrapping band -->
  <path d="M8 118 Q14 114 28 114 Q42 114 48 118 L48 124 Q42 120 28 120 Q14 120 8 124 Z" fill="#1e3050" stroke="#0a0a0a" stroke-width="1" opacity="0.5"/>
  <!-- Fabric wear/thinning highlight -->
  <path d="M32 40 Q34 50 32 60" stroke="#243660" stroke-width="0.5" fill="none" opacity="0.3"/>
  <!-- Outline reinforcement -->
  <path d="M6 4 Q14 0 28 0 Q42 0 50 4 L52 35 Q54 70 52 105 L48 132 Q42 144 28 144 Q14 144 6 132 L4 105 Q2 70 4 35 Z" fill="none" stroke="#0a0a0a" stroke-width="2"/>
</svg>
