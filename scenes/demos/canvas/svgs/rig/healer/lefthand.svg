<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <radialGradient id="lhGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#60a0a0" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#60a0a0" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#60a0a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lhSkin" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e8dcc8"/>
      <stop offset="100%" stop-color="#d4c8b0"/>
    </radialGradient>
  </defs>
  <!-- Luminous glow around hand -->
  <ellipse cx="20" cy="20" rx="20" ry="20" fill="url(#lhGlow)"/>
  <!-- Palm base -->
  <path d="M10 8 Q8 14 8 22 Q8 30 12 36 Q16 40 24 40 Q30 38 32 32 Q34 22 32 14 Q30 8 26 6 Z" fill="url(#lhSkin)" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Thumb -->
  <path d="M10 14 Q6 12 5 8 Q4 4 8 3 Q12 3 12 8 L12 14" fill="#e0d4c0" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Finger lines -->
  <line x1="16" y1="6" x2="16" y2="2" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="21" y1="4" x2="21" y2="0" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="5" x2="27" y2="1" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="30" y1="8" x2="32" y2="4" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Finger tips -->
  <ellipse cx="16" cy="2" rx="2.5" ry="3" fill="#e0d4c0" stroke="#0a0a0a" stroke-width="1.5"/>
  <ellipse cx="21" cy="0" rx="2.5" ry="3" fill="#e0d4c0" stroke="#0a0a0a" stroke-width="1.5"/>
  <ellipse cx="27" cy="1" rx="2.5" ry="3" fill="#e0d4c0" stroke="#0a0a0a" stroke-width="1.5"/>
  <ellipse cx="32" cy="4" rx="2.5" ry="3" fill="#e0d4c0" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Knuckle lines -->
  <path d="M14 12 Q16 10 18 12" stroke="#c0b4a0" stroke-width="0.8" fill="none"/>
  <path d="M19 10 Q21 8 23 10" stroke="#c0b4a0" stroke-width="0.8" fill="none"/>
  <path d="M24 11 Q26 9 28 11" stroke="#c0b4a0" stroke-width="0.8" fill="none"/>
  <!-- Palm creases -->
  <path d="M12 20 Q18 18 28 22" stroke="#c0b4a0" stroke-width="0.6" fill="none" opacity="0.5"/>
  <path d="M12 26 Q18 24 26 28" stroke="#c0b4a0" stroke-width="0.6" fill="none" opacity="0.5"/>
  <!-- Shadow on palm -->
  <path d="M10 20 Q12 28 14 34 Q18 38 22 38" fill="#c0b4a0" opacity="0.2"/>
  <!-- Fingertip glow — subtle teal -->
  <circle cx="16" cy="1" r="3" fill="#60a0a0" opacity="0.12"/>
  <circle cx="21" cy="-1" r="3" fill="#60a0a0" opacity="0.12"/>
  <circle cx="27" cy="0" r="3" fill="#60a0a0" opacity="0.12"/>
  <circle cx="32" cy="3" r="3" fill="#60a0a0" opacity="0.12"/>
</svg>
