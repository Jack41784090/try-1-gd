<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 144" width="56" height="144">
  <defs>
    <linearGradient id="raSleeve" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="50%" stop-color="#1e3050"/>
      <stop offset="100%" stop-color="#152240"/>
    </linearGradient>
    <linearGradient id="raShadow" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#0a1020" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a1020" stop-opacity="0"/>
    </linearGradient>
    <pattern id="raHatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(50)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#0a1020" stroke-width="0.5" opacity="0.2"/>
    </pattern>
  </defs>
  <!-- Wide robe sleeve — slightly lighter (near side) -->
  <path d="M6 4 Q14 0 28 0 Q42 0 50 4 L54 40 Q56 80 54 120 L50 138 Q42 144 28 144 Q14 144 6 138 L2 120 Q0 80 2 40 Z" fill="url(#raSleeve)" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Cross-hatching on right shadow side -->
  <path d="M28 0 Q42 0 50 4 L54 40 Q56 80 54 120 L50 138 Q42 144 28 144 Z" fill="url(#raHatch)" opacity="0.35"/>
  <!-- Shadow gradient on right side -->
  <path d="M38 0 L50 4 L54 40 Q56 80 54 120 L50 138 Q42 144 38 144 Z" fill="url(#raShadow)"/>
  <!-- Cloth fold lines -->
  <path d="M18 6 Q16 40 18 80 Q20 110 18 138" stroke="#0e1830" stroke-width="1.2" fill="none" opacity="0.45"/>
  <path d="M30 6 Q28 50 30 100 Q32 130 30 142" stroke="#0e1830" stroke-width="1" fill="none" opacity="0.35"/>
  <path d="M42 10 Q40 50 42 100 Q44 130 42 138" stroke="#0e1830" stroke-width="1" fill="none" opacity="0.4"/>
  <!-- Flowing fabric wave -->
  <path d="M12 25 Q10 35 12 45" stroke="#243660" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M12 65 Q10 75 12 85" stroke="#243660" stroke-width="0.8" fill="none" opacity="0.4"/>
  <!-- Light highlight on near side -->
  <path d="M10 10 Q8 40 10 80 Q12 110 10 136" stroke="#243660" stroke-width="0.6" fill="none" opacity="0.3"/>
  <!-- Cream lining peeking at wrist -->
  <path d="M10 130 Q14 136 28 140 Q42 136 46 130 L46 138 Q42 144 28 144 Q14 144 10 138 Z" fill="#d0c8b0" stroke="#0a0a0a" stroke-width="1.5"/>
  <path d="M12 132 Q16 136 28 138 Q40 136 44 132" stroke="#b0a890" stroke-width="0.6" fill="none" opacity="0.5"/>
  <!-- Sleeve opening shadow -->
  <path d="M10 130 Q18 126 28 125 Q38 126 46 130" stroke="#0a1020" stroke-width="1" fill="none" opacity="0.35"/>
  <!-- Outer outline reinforcement -->
  <path d="M6 4 Q14 0 28 0 Q42 0 50 4 L54 40 Q56 80 54 120 L50 138 Q42 144 28 144 Q14 144 6 138 L2 120 Q0 80 2 40 Z" fill="none" stroke="#0a0a0a" stroke-width="2"/>
</svg>
