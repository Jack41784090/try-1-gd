<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 48" width="96" height="48">
  <defs>
    <linearGradient id="lfGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#2a2018"/>
    </linearGradient>
    <pattern id="lfHatch" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#0a0a0a" stroke-width="0.4" opacity="0.3"/>
    </pattern>
  </defs>
  <!-- Sandal sole -->
  <path d="M12 38 Q20 44 48 46 Q76 44 88 38 L90 42 Q76 48 48 48 Q20 48 6 42 Z" fill="#1a1410" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Cloth-wrapped foot base -->
  <path d="M10 12 Q14 4 30 2 Q50 0 68 2 Q82 4 88 12 L90 30 Q88 40 78 44 Q60 48 40 48 Q20 48 12 44 Q6 40 6 30 Z" fill="url(#lfGrad)" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Cross-hatching -->
  <path d="M10 12 Q14 4 30 2 Q50 0 68 2 L68 48 Q40 48 20 48 Q12 44 6 40 L6 30 Z" fill="url(#lfHatch)" opacity="0.35"/>
  <!-- Leather strap across — front -->
  <path d="M20 10 Q30 16 48 18 Q66 16 76 10" stroke="#4a3a28" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M20 10 Q30 16 48 18 Q66 16 76 10" stroke="#5a4a38" stroke-width="1" fill="none" opacity="0.4"/>
  <!-- Leather strap across — middle -->
  <path d="M14 24 Q28 30 48 32 Q68 30 82 24" stroke="#4a3a28" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M14 24 Q28 30 48 32 Q68 30 82 24" stroke="#5a4a38" stroke-width="1" fill="none" opacity="0.4"/>
  <!-- Vertical strap connecting the two -->
  <path d="M34 14 L32 28" stroke="#4a3a28" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M62 14 L64 28" stroke="#4a3a28" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Cloth wrapping texture -->
  <path d="M18 8 Q24 6 32 6" stroke="#2a2018" stroke-width="0.6" fill="none" opacity="0.5"/>
  <path d="M22 18 Q34 22 50 24" stroke="#2a2018" stroke-width="0.6" fill="none" opacity="0.4"/>
  <path d="M16 34 Q30 38 50 40 Q70 38 82 34" stroke="#2a2018" stroke-width="0.6" fill="none" opacity="0.4"/>
  <!-- Toe area definition -->
  <path d="M82 14 Q86 18 88 26 Q88 32 86 36" stroke="#1a1410" stroke-width="1" fill="none" opacity="0.5"/>
  <!-- Shadow on inner side -->
  <path d="M10 12 L6 30 Q6 40 12 44 Q16 46 24 48 L24 4 Q18 6 10 12 Z" fill="#0a1020" opacity="0.2"/>
  <!-- Strap buckle detail -->
  <rect x="46" y="8" width="4" height="4" rx="1" fill="#6a5a40" stroke="#0a0a0a" stroke-width="0.8"/>
  <!-- Outline reinforcement -->
  <path d="M10 12 Q14 4 30 2 Q50 0 68 2 Q82 4 88 12 L90 30 Q88 40 78 44 Q60 48 40 48 Q20 48 12 44 Q6 40 6 30 Z" fill="none" stroke="#0a0a0a" stroke-width="2"/>
</svg>
