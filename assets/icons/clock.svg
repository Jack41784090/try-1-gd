<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <circle cx="16" cy="16" r="14" fill="#1f1a14" fill-opacity="0.92" stroke="#a68c5a" stroke-width="2"/>
  <circle cx="16" cy="16" r="12.5" fill="none" stroke="#73613f" stroke-width="0.75"/>
  <!-- Major ticks (12, 3, 6, 9) -->
  <line x1="16" y1="4.5" x2="16" y2="7" stroke="#f2e6bf" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="27.5" y1="16" x2="25" y2="16" stroke="#f2e6bf" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="27.5" x2="16" y2="25" stroke="#f2e6bf" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="4.5" y1="16" x2="7" y2="16" stroke="#f2e6bf" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Minor ticks -->
  <line x1="22.2" y1="6.4" x2="21.2" y2="8.1" stroke="#d9c899" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="25.6" y1="9.8" x2="23.9" y2="10.8" stroke="#d9c899" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="25.6" y1="22.2" x2="23.9" y2="21.2" stroke="#d9c899" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="22.2" y1="25.6" x2="21.2" y2="23.9" stroke="#d9c899" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="9.8" y1="25.6" x2="10.8" y2="23.9" stroke="#d9c899" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="6.4" y1="22.2" x2="8.1" y2="21.2" stroke="#d9c899" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="6.4" y1="9.8" x2="8.1" y2="10.8" stroke="#d9c899" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="9.8" y1="6.4" x2="10.8" y2="8.1" stroke="#d9c899" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Hour hand (pointing at ~10 o'clock) -->
  <line x1="16" y1="16" x2="11" y2="9.5" stroke="#f2e6bf" stroke-width="2" stroke-linecap="round"/>
  <!-- Minute hand (pointing at 12) -->
  <line x1="16" y1="16" x2="16" y2="6.5" stroke="#ccbf99" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.8" fill="#d9bf80"/>
  <circle cx="16" cy="16" r="1.8" fill="none" stroke="#000000" stroke-width="0.5" stroke-opacity="0.5"/>
</svg>
