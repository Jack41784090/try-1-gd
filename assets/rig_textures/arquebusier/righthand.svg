<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <radialGradient id="handGradR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a6a50"/>
      <stop offset="70%" stop-color="#7a5a40"/>
      <stop offset="100%" stop-color="#6a4a30"/>
    </radialGradient>
  </defs>
  <!-- Palm -->
  <ellipse cx="20" cy="18" rx="14" ry="14" fill="url(#handGradR)" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Palm shadow (mirrored) -->
  <ellipse cx="24" cy="20" rx="8" ry="10" fill="#000000" opacity="0.12"/>
  <!-- Fingers -->
  <path d="M30 8 Q32 2 30 0 Q26 -1 26 6" fill="#8a6a50" stroke="#0a0a0a" stroke-width="1.5"/>
  <path d="M24 5 Q24 -2 22 -3 Q18 -3 20 4" fill="#8a6a50" stroke="#0a0a0a" stroke-width="1.5"/>
  <path d="M16 5 Q14 -2 12 -2 Q10 0 12 6" fill="#8a6a50" stroke="#0a0a0a" stroke-width="1.5"/>
  <path d="M10 10 Q6 4 4 6 Q4 10 8 14" fill="#8a6a50" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Thumb -->
  <path d="M34 18 Q40 14 38 10 Q36 8 32 12" fill="#8a6a50" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Knuckle creases -->
  <path d="M22 8 Q26 6 30 10" stroke="#5a3a28" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M12 10 Q16 8 20 10" stroke="#5a3a28" stroke-width="0.8" fill="none" opacity="0.35"/>
  <!-- Palm lines -->
  <path d="M32 18 Q24 22 14 16" stroke="#5a3a28" stroke-width="0.6" fill="none" opacity="0.3"/>
  <path d="M30 24 Q22 26 12 22" stroke="#5a3a28" stroke-width="0.5" fill="none" opacity="0.25"/>
  <!-- Soot/powder stains -->
  <ellipse cx="22" cy="14" rx="5" ry="4" fill="#2a2020" opacity="0.2"/>
  <circle cx="14" cy="10" r="3" fill="#1a1210" opacity="0.15"/>
  <circle cx="28" cy="6" r="2" fill="#3a2a1a" opacity="0.18"/>
  <!-- Gunpowder blackening on fingertips -->
  <circle cx="30" cy="2" r="2.5" fill="#2a2020" opacity="0.25"/>
  <circle cx="22" cy="-1" r="2.5" fill="#2a2020" opacity="0.25"/>
  <circle cx="13" cy="0" r="2.5" fill="#2a2020" opacity="0.2"/>
  <!-- Wrist area -->
  <path d="M32 30 Q20 34 8 30" fill="#7a5a40" stroke="#0a0a0a" stroke-width="1" opacity="0.6"/>
