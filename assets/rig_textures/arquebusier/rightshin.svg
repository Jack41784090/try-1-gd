<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 144" width="56" height="144">
  <defs>
    <linearGradient id="gaiterGradR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="60%" stop-color="#4a3828"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="gaiterShadR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <pattern id="leatherHatchR" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="4" stroke="#1a1210" stroke-width="0.4" opacity="0.12"/>
    </pattern>
  </defs>
  <!-- Gaiter/legging shape -->
  <path d="M8 2 Q28 0 48 2 Q50 4 50 10 L48 134 Q46 140 28 142 Q10 140 8 134 L6 10 Q6 4 8 2Z" fill="url(#gaiterGradR)" stroke="#0a0a0a" stroke-width="2"/>
