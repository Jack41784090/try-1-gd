  <circle cx="12" cy="16" r="2" fill="#7a6a30" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="12" cy="32" r="2" fill="#7a6a30" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="12" cy="48" r="2" fill="#7a6a30" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="12" cy="64" r="2" fill="#7a6a30" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="12" cy="80" r="2" fill="#7a6a30" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="12" cy="96" r="2" fill="#7a6a30" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="12" cy="112" r="2" fill="#7a6a30" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="12" cy="128" r="2" fill="#7a6a30" stroke="#0a0a0a" stroke-width="0.8"/>
  <!-- Button seam -->
  <line x1="12" y1="8" x2="12" y2="136" stroke="#1a1210" stroke-width="0.8" opacity="0.25"/>
  <!-- Scuff marks -->
  <ellipse cx="36" cy="118" rx="7" ry="4" fill="#4a3a28" opacity="0.18" transform="rotate(5 36 118)"/>
  <ellipse cx="26" cy="95" rx="5" ry="3" fill="#4a3a28" opacity="0.12"/>
  <ellipse cx="38" cy="55" rx="5" ry="3" fill="#1a1210" opacity="0.08"/>
