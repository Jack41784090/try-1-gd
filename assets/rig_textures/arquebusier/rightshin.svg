  <path d="M40 22 Q32 30 36 44" stroke="#1a1210" stroke-width="0.7" fill="none" opacity="0.2"/>
  <path d="M18 40 Q26 48 22 64" stroke="#1a1210" stroke-width="0.6" fill="none" opacity="0.16"/>
  <path d="M38 75 Q30 82 34 98" stroke="#1a1210" stroke-width="0.6" fill="none" opacity="0.16"/>
  <!-- Cross-hatching -->
  <line x1="44" y1="20" x2="48" y2="50" stroke="#1a1210" stroke-width="0.4" opacity="0.15"/>
  <line x1="44" y1="55" x2="48" y2="85" stroke="#1a1210" stroke-width="0.4" opacity="0.12"/>
  <line x1="44" y1="90" x2="48" y2="120" stroke="#1a1210" stroke-width="0.4" opacity="0.1"/>
