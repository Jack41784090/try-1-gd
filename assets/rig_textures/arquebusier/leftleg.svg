<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 192" width="64" height="192">
  <defs>
    <linearGradient id="legGradL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a1a14"/>
      <stop offset="40%" stop-color="#3a2a20"/>
      <stop offset="100%" stop-color="#2a2018"/>
    </linearGradient>
    <linearGradient id="legShadL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <pattern id="breeches" width="5" height="5" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="5" y2="5" stroke="#1a1210" stroke-width="0.3" opacity="0.12"/>
    </pattern>
  </defs>
  <!-- Breeches/trousers under coat tail -->
  <path d="M8 2 Q32 0 56 2 Q60 6 58 12 L54 186 Q52 190 32 192 Q12 190 10 186 L6 12 Q4 6 8 2Z" fill="url(#legGradL)" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Fabric texture -->
  <path d="M8 2 Q32 0 56 2 Q60 6 58 12 L54 186 Q52 190 32 192 Q12 190 10 186 L6 12 Q4 6 8 2Z" fill="url(#breeches)"/>
  <!-- Shadow side -->
  <path d="M4 6 L10 186 Q12 190 20 192 L16 2 Q10 2 4 6Z" fill="url(#legShadL)"/>
  <!-- Coat tail overlap at top -->
  <path d="M4 0 Q32 -2 60 0 L58 30 Q32 26 6 30Z" fill="#3a2a20" stroke="#0a0a0a" stroke-width="1.5" opacity="0.5"/>
  <!-- Vertical crease -->
  <path d="M32 10 L32 188" stroke="#1a1210" stroke-width="0.8" fill="none" opacity="0.2"/>
  <!-- Fabric creases -->
  <path d="M16 30 Q24 40 18 60" stroke="#1a1210" stroke-width="0.7" fill="none" opacity="0.22"/>
  <path d="M46 50 Q38 62 42 85" stroke="#1a1210" stroke-width="0.6" fill="none" opacity="0.18"/>
  <path d="M14 100 Q24 110 18 130" stroke="#1a1210" stroke-width="0.6" fill="none" opacity="0.18"/>
  <path d="M44 120 Q36 132 40 155" stroke="#1a1210" stroke-width="0.5" fill="none" opacity="0.15"/>
  <!-- Knee area bunching -->
  <path d="M12 90 Q32 86 52 90" stroke="#1a1210" stroke-width="0.8" fill="none" opacity="0.2"/>
  <path d="M14 96 Q32 92 50 96" stroke="#1a1210" stroke-width="0.6" fill="none" opacity="0.15"/>
  <!-- Soot marks -->
  <ellipse cx="28" cy="60" rx="8" ry="5" fill="#1a1210" opacity="0.08" transform="rotate(-8 28 60)"/>
  <ellipse cx="38" cy="140" rx="6" ry="4" fill="#1a1210" opacity="0.07"/>
  <!-- Cross-hatching on dark side -->
  <line x1="10" y1="30" x2="14" y2="60" stroke="#1a1210" stroke-width="0.4" opacity="0.15"/>
  <line x1="10" y1="70" x2="14" y2="100" stroke="#1a1210" stroke-width="0.4" opacity="0.12"/>
  <line x1="10" y1="110" x2="14" y2="140" stroke="#1a1210" stroke-width="0.4" opacity="0.1"/>
  <line x1="10" y1="150" x2="14" y2="180" stroke="#1a1210" stroke-width="0.4" opacity="0.08"/>
</svg>
