<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 144" width="56" height="144">
  <defs>
    <linearGradient id="gaiterGradL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a1a10"/>
      <stop offset="40%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#2a1a14"/>
    </linearGradient>
    <linearGradient id="gaiterShadL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <pattern id="leatherHatchL" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="4" stroke="#1a1210" stroke-width="0.4" opacity="0.15"/>
    </pattern>
  </defs>
  <!-- Gaiter/legging shape -->
  <path d="M8 2 Q28 0 48 2 Q50 4 50 10 L48 134 Q46 140 28 142 Q10 140 8 134 L6 10 Q6 4 8 2Z" fill="url(#gaiterGradL)" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Leather texture -->
  <path d="M8 2 Q28 0 48 2 Q50 4 50 10 L48 134 Q46 140 28 142 Q10 140 8 134 L6 10 Q6 4 8 2Z" fill="url(#leatherHatchL)"/>
  <!-- Shadow side -->
  <path d="M6 4 L8 134 Q10 140 18 142 L14 2 Q10 2 6 4Z" fill="url(#gaiterShadL)"/>
  <!-- Top cuff band -->
  <path d="M6 4 Q28 0 50 4 Q50 10 28 8 Q6 10 6 4Z" fill="#2a1a10" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Button-up side - row of buttons -->
  <circle cx="44" cy="16" r="2" fill="#7a6a30" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="44" cy="32" r="2" fill="#7a6a30" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="44" cy="48" r="2" fill="#7a6a30" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="44" cy="64" r="2" fill="#7a6a30" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="44" cy="80" r="2" fill="#7a6a30" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="44" cy="96" r="2" fill="#7a6a30" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="44" cy="112" r="2" fill="#7a6a30" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="44" cy="128" r="2" fill="#7a6a30" stroke="#0a0a0a" stroke-width="0.8"/>
  <!-- Button line seam -->
  <line x1="44" y1="8" x2="44" y2="136" stroke="#1a1210" stroke-width="0.8" opacity="0.3"/>
  <!-- Scuff marks -->
  <ellipse cx="20" cy="120" rx="8" ry="5" fill="#4a3a28" opacity="0.2" transform="rotate(-5 20 120)"/>
  <ellipse cx="30" cy="100" rx="6" ry="3" fill="#4a3a28" opacity="0.15"/>
  <ellipse cx="16" cy="60" rx="5" ry="3" fill="#1a1210" opacity="0.1"/>
  <!-- Creases at knee/shin -->
  <path d="M12 20 Q22 26 16 40" stroke="#1a1210" stroke-width="0.7" fill="none" opacity="0.22"/>
  <path d="M36 35 Q28 45 34 60" stroke="#1a1210" stroke-width="0.6" fill="none" opacity="0.18"/>
  <path d="M14 70 Q24 78 18 95" stroke="#1a1210" stroke-width="0.6" fill="none" opacity="0.18"/>
  <!-- Cross-hatching shadow -->
  <line x1="8" y1="20" x2="12" y2="50" stroke="#1a1210" stroke-width="0.4" opacity="0.18"/>
  <line x1="8" y1="55" x2="12" y2="85" stroke="#1a1210" stroke-width="0.4" opacity="0.15"/>
  <line x1="8" y1="90" x2="12" y2="120" stroke="#1a1210" stroke-width="0.4" opacity="0.12"/>
  <!-- Bottom ankle area -->
  <path d="M8 132 Q28 136 48 132" stroke="#1a1210" stroke-width="1" fill="none" opacity="0.25"/>
  <!-- Wear shine on knee -->
  <ellipse cx="28" cy="30" rx="10" ry="6" fill="#4a3a28" opacity="0.1"/>
</svg>
