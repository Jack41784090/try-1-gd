<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 144" width="56" height="144">
  <defs>
    <linearGradient id="sleeveGradL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a1a14"/>
      <stop offset="40%" stop-color="#3a2a20"/>
      <stop offset="100%" stop-color="#2a2018"/>
    </linearGradient>
    <linearGradient id="sleeveShadowL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Sleeve shape - looser fit -->
  <path d="M8 2 Q28 0 48 2 Q52 4 52 10 L50 138 Q48 142 28 144 Q8 142 6 138 L4 10 Q4 4 8 2Z" fill="url(#sleeveGradL)" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Shadow on far side (left = darker) -->
  <path d="M4 4 L6 138 Q8 142 18 144 L16 2 Q10 2 4 4Z" fill="url(#sleeveShadowL)"/>
  <!-- Shoulder seam -->
  <path d="M8 4 Q28 0 48 4" stroke="#1a1210" stroke-width="1.5" fill="none" opacity="0.4"/>
  <!-- Sleeve creases -->
  <path d="M14 30 Q22 36 18 50" stroke="#1a1210" stroke-width="0.8" fill="none" opacity="0.25"/>
  <path d="M40 40 Q34 52 38 70" stroke="#1a1210" stroke-width="0.7" fill="none" opacity="0.2"/>
  <path d="M12 80 Q22 86 16 100" stroke="#1a1210" stroke-width="0.7" fill="none" opacity="0.22"/>
  <path d="M38 90 Q30 100 36 120" stroke="#1a1210" stroke-width="0.6" fill="none" opacity="0.18"/>
  <!-- Cross-hatching shadow area -->
  <line x1="8" y1="20" x2="14" y2="40" stroke="#1a1210" stroke-width="0.4" opacity="0.2"/>
  <line x1="10" y1="40" x2="16" y2="60" stroke="#1a1210" stroke-width="0.4" opacity="0.18"/>
  <line x1="8" y1="60" x2="14" y2="80" stroke="#1a1210" stroke-width="0.4" opacity="0.15"/>
  <line x1="10" y1="80" x2="16" y2="100" stroke="#1a1210" stroke-width="0.4" opacity="0.15"/>
  <!-- Soot stains -->
  <ellipse cx="30" cy="45" rx="8" ry="5" fill="#1a1210" opacity="0.1" transform="rotate(-10 30 45)"/>
  <ellipse cx="20" cy="100" rx="6" ry="4" fill="#1a1210" opacity="0.08"/>
  <!-- Powder burn mark -->
  <circle cx="36" cy="70" r="3" fill="#8a4a20" opacity="0.12"/>
  <!-- Subtle elbow area wear -->
  <ellipse cx="28" cy="72" rx="12" ry="8" fill="#4a3828" opacity="0.15"/>
  <!-- Seam line -->
  <line x1="28" y1="6" x2="28" y2="140" stroke="#1a1210" stroke-width="0.5" opacity="0.15"/>
