<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <radialGradient id="handGradL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a6a50"/>
      <stop offset="70%" stop-color="#7a5a40"/>
      <stop offset="100%" stop-color="#6a4a30"/>
    </radialGradient>
  </defs>
  <!-- Palm -->
  <ellipse cx="20" cy="18" rx="14" ry="14" fill="url(#handGradL)" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Palm shadow -->
  <ellipse cx="16" cy="20" rx="8" ry="10" fill="#000000" opacity="0.15"/>
  <!-- Fingers -->
  <path d="M10 8 Q8 2 10 0 Q14 -1 14 6" fill="#8a6a50" stroke="#0a0a0a" stroke-width="1.5"/>
  <path d="M16 5 Q16 -2 18 -3 Q22 -3 20 4" fill="#8a6a50" stroke="#0a0a0a" stroke-width="1.5"/>
  <path d="M24 5 Q26 -2 28 -2 Q30 0 28 6" fill="#8a6a50" stroke="#0a0a0a" stroke-width="1.5"/>
  <path d="M30 10 Q34 4 36 6 Q36 10 32 14" fill="#8a6a50" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Thumb -->
  <path d="M6 18 Q0 14 2 10 Q4 8 8 12" fill="#8a6a50" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Knuckle creases -->
  <path d="M10 10 Q14 8 18 10" stroke="#5a3a28" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M20 8 Q24 6 28 10" stroke="#5a3a28" stroke-width="0.8" fill="none" opacity="0.35"/>
  <!-- Palm lines -->
  <path d="M8 18 Q16 22 26 16" stroke="#5a3a28" stroke-width="0.6" fill="none" opacity="0.3"/>
  <path d="M10 24 Q18 26 28 22" stroke="#5a3a28" stroke-width="0.5" fill="none" opacity="0.25"/>
  <!-- Soot/powder stains -->
  <ellipse cx="18" cy="14" rx="5" ry="4" fill="#2a2020" opacity="0.2"/>
  <circle cx="26" cy="10" r="3" fill="#1a1210" opacity="0.15"/>
  <circle cx="12" cy="6" r="2" fill="#3a2a1a" opacity="0.2"/>
  <!-- Gunpowder blackening on fingertips -->
  <circle cx="10" cy="2" r="2.5" fill="#2a2020" opacity="0.25"/>
  <circle cx="18" cy="-1" r="2.5" fill="#2a2020" opacity="0.25"/>
  <circle cx="27" cy="0" r="2.5" fill="#2a2020" opacity="0.2"/>
  <!-- Wrist area -->
  <path d="M8 30 Q20 34 32 30" fill="#7a5a40" stroke="#0a0a0a" stroke-width="1" opacity="0.6"/>
</svg>
