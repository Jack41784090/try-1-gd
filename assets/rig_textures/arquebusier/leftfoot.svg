<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 48" width="96" height="48">
  <defs>
    <linearGradient id="bootGradL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1a14"/>
      <stop offset="60%" stop-color="#1a1210"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="bootShadL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <!-- Boot sole -->
  <path d="M10 40 Q40 44 80 40 Q88 40 90 38 L90 44 Q88 48 80 46 Q40 48 10 46 Q4 46 2 44 L2 38 Q4 40 10 40Z" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="1"/>
  <!-- Boot body -->
  <path d="M14 6 Q40 2 72 6 Q80 8 84 14 L86 36 Q84 40 80 40 Q40 44 10 40 Q4 40 2 36 L4 18 Q6 10 14 6Z" fill="url(#bootGradL)" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Boot shadow -->
  <path d="M14 6 Q40 2 72 6 Q80 8 84 14 L86 36 Q84 40 80 40 Q40 44 10 40 Q4 40 2 36 L4 18 Q6 10 14 6Z" fill="url(#bootShadL)"/>
  <!-- Toe cap -->
  <path d="M4 28 Q4 18 14 12 Q30 6 50 10 L48 34 Q30 38 10 34 Q4 32 4 28Z" fill="#2a1a10" stroke="#0a0a0a" stroke-width="1.5" opacity="0.6"/>
  <!-- Toe cap seam -->
  <path d="M50 10 Q48 22 48 34" stroke="#1a1210" stroke-width="1" fill="none" opacity="0.3"/>
  <!-- Heel - spur suggestion -->
  <path d="M72 30 Q78 28 84 30 L86 38 Q84 42 80 42 Q74 42 72 38Z" fill="#1a1210" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Spur nub -->
  <circle cx="86" cy="36" r="2.5" fill="#4a4a50" stroke="#0a0a0a" stroke-width="1"/>
  <circle cx="86" cy="36" r="1" fill="#6a6a70" opacity="0.5"/>
  <!-- Boot top opening -->
  <path d="M14 6 Q40 2 72 6" stroke="#3a2818" stroke-width="2" fill="none"/>
  <!-- Ankle padding -->
  <path d="M14 6 Q14 12 20 14 Q40 8 60 12 Q68 12 72 6" fill="#3a2818" stroke="#0a0a0a" stroke-width="1" opacity="0.4"/>
  <!-- Leather creases -->
  <path d="M20 20 Q30 24 24 32" stroke="#1a1210" stroke-width="0.7" fill="none" opacity="0.25"/>
  <path d="M36 16 Q42 22 38 30" stroke="#1a1210" stroke-width="0.6" fill="none" opacity="0.2"/>
  <path d="M56 18 Q60 24 56 32" stroke="#1a1210" stroke-width="0.6" fill="none" opacity="0.18"/>
  <!-- Scuff marks -->
  <ellipse cx="30" cy="34" rx="6" ry="3" fill="#3a2a18" opacity="0.15"/>
  <ellipse cx="50" cy="30" rx="4" ry="2" fill="#3a2a18" opacity="0.12"/>
  <!-- Cross-hatching on dark areas -->
  <line x1="8" y1="24" x2="16" y2="38" stroke="#0a0a0a" stroke-width="0.4" opacity="0.2"/>
  <line x1="14" y1="22" x2="22" y2="36" stroke="#0a0a0a" stroke-width="0.4" opacity="0.15"/>
  <!-- Stitching -->
  <path d="M14 14 Q40 10 72 14" stroke="#4a3a28" stroke-width="0.5" stroke-dasharray="2,3" fill="none" opacity="0.3"/>
</svg>
