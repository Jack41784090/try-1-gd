<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 192" width="64" height="192">
  <defs>
    <linearGradient id="legGradR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a2a20"/>
      <stop offset="60%" stop-color="#4a3828"/>
      <stop offset="100%" stop-color="#3a2a20"/>
    </linearGradient>
    <linearGradient id="legShadR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <pattern id="breechesR" width="5" height="5" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="5" y2="5" stroke="#1a1210" stroke-width="0.3" opacity="0.1"/>
    </pattern>
  </defs>
  <!-- Breeches -->
  <path d="M8 2 Q32 0 56 2 Q60 6 58 12 L54 186 Q52 190 32 192 Q12 190 10 186 L6 12 Q4 6 8 2Z" fill="url(#legGradR)" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Fabric texture -->
  <path d="M8 2 Q32 0 56 2 Q60 6 58 12 L54 186 Q52 190 32 192 Q12 190 10 186 L6 12 Q4 6 8 2Z" fill="url(#breechesR)"/>
  <!-- Right shadow -->
  <path d="M60 6 L54 186 Q52 190 44 192 L48 2 Q54 2 60 6Z" fill="url(#legShadR)"/>
  <!-- Coat tail at top -->
  <path d="M4 0 Q32 -2 60 0 L58 30 Q32 26 6 30Z" fill="#3a2a20" stroke="#0a0a0a" stroke-width="1.5" opacity="0.5"/>
  <!-- Light catch -->
  <path d="M20 10 Q28 6 36 10 L34 80 Q28 76 22 80Z" fill="#4a3a28" opacity="0.08"/>
  <!-- Vertical crease -->
  <path d="M32 10 L32 188" stroke="#1a1210" stroke-width="0.8" fill="none" opacity="0.18"/>
  <!-- Fabric creases -->
  <path d="M44 28 Q36 38 40 58" stroke="#1a1210" stroke-width="0.7" fill="none" opacity="0.2"/>
  <path d="M18 48 Q26 58 22 80" stroke="#1a1210" stroke-width="0.6" fill="none" opacity="0.16"/>
  <path d="M46 95 Q38 106 42 128" stroke="#1a1210" stroke-width="0.6" fill="none" opacity="0.16"/>
  <path d="M20 130 Q28 140 24 160" stroke="#1a1210" stroke-width="0.5" fill="none" opacity="0.14"/>
  <!-- Knee bunching -->
  <path d="M12 90 Q32 86 52 90" stroke="#1a1210" stroke-width="0.8" fill="none" opacity="0.18"/>
  <path d="M14 96 Q32 92 50 96" stroke="#1a1210" stroke-width="0.6" fill="none" opacity="0.13"/>
  <!-- Soot marks -->
  <ellipse cx="36" cy="55" rx="7" ry="4" fill="#1a1210" opacity="0.07" transform="rotate(10 36 55)"/>
  <ellipse cx="26" cy="150" rx="6" ry="3" fill="#1a1210" opacity="0.06"/>
  <!-- Cross-hatching -->
  <line x1="50" y1="30" x2="54" y2="60" stroke="#1a1210" stroke-width="0.4" opacity="0.12"/>
  <line x1="50" y1="70" x2="54" y2="100" stroke="#1a1210" stroke-width="0.4" opacity="0.1"/>
  <line x1="50" y1="120" x2="54" y2="150" stroke="#1a1210" stroke-width="0.4" opacity="0.08"/>
</svg>
