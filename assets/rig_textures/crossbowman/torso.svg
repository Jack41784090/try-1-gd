<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 176" width="192" height="176">
  <defs>
    <linearGradient id="jerkinGrad" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="50%" stop-color="#4e3620"/>
      <stop offset="100%" stop-color="#2e1c10"/>
    </linearGradient>
    <linearGradient id="tunicGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a4422"/>
      <stop offset="100%" stop-color="#1a3018"/>
    </linearGradient>
    <pattern id="leatherGrain" patternUnits="userSpaceOnUse" width="8" height="8">
      <circle cx="2" cy="2" r="0.5" fill="#0a0a0a" opacity="0.1"/>
      <circle cx="6" cy="5" r="0.4" fill="#0a0a0a" opacity="0.08"/>
      <circle cx="4" cy="7" r="0.3" fill="#0a0a0a" opacity="0.12"/>
    </pattern>
    <pattern id="crossHatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#0a0a0a" stroke-width="0.6" opacity="0.15"/>
    </pattern>
    <pattern id="quiltLines" patternUnits="userSpaceOnUse" width="16" height="16">
      <line x1="0" y1="0" x2="16" y2="16" stroke="#2a1c10" stroke-width="0.8" opacity="0.3"/>
      <line x1="16" y1="0" x2="0" y2="16" stroke="#2a1c10" stroke-width="0.8" opacity="0.3"/>
    </pattern>
  </defs>
  <!-- Base tunic -->
  <path d="M24 0 Q20 4 16 20 L8 176 L184 176 L176 20 Q172 4 168 0Z" fill="url(#tunicGrad)" stroke="#0a0a0a" stroke-width="2.5"/>
  <!-- Tunic quilted padding suggestion -->
  <path d="M24 0 Q20 4 16 20 L8 176 L184 176 L176 20 Q172 4 168 0Z" fill="url(#quiltLines)"/>
  <!-- Leather jerkin overlay -->
  <path d="M36 8 Q32 16 28 40 L20 140 Q96 156 172 140 L164 40 Q160 16 156 8Z" fill="url(#jerkinGrad)" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Leather grain texture -->
  <path d="M36 8 Q32 16 28 40 L20 140 Q96 156 172 140 L164 40 Q160 16 156 8Z" fill="url(#leatherGrain)"/>
  <!-- Jerkin center seam -->
  <line x1="96" y1="8" x2="96" y2="150" stroke="#2a1c10" stroke-width="1.5" opacity="0.5"/>
  <!-- Jerkin stitching along edges -->
  <path d="M36 8 Q32 16 28 40 L20 140" stroke="#5a4430" stroke-width="1" stroke-dasharray="3,4" fill="none" opacity="0.4"/>
  <path d="M156 8 Q160 16 164 40 L172 140" stroke="#5a4430" stroke-width="1" stroke-dasharray="3,4" fill="none" opacity="0.4"/>
  <!-- Diagonal strap 1 — shoulder to hip (quiver strap) -->
  <path d="M140 0 L52 160" stroke="#3a2818" stroke-width="8" fill="none"/>
  <path d="M140 0 L52 160" stroke="#4e3620" stroke-width="5" fill="none"/>
  <path d="M140 0 L52 160" stroke="#5a4430" stroke-width="2" fill="none" opacity="0.3"/>
  <!-- Strap 1 edge stitching -->
  <path d="M138 2 L50 162" stroke="#2a1c10" stroke-width="0.8" stroke-dasharray="2,3" fill="none" opacity="0.5"/>
  <path d="M142 2 L54 162" stroke="#2a1c10" stroke-width="0.8" stroke-dasharray="2,3" fill="none" opacity="0.5"/>
  <!-- Diagonal strap 2 — opposite shoulder -->
  <path d="M52 0 L130 140" stroke="#3a2818" stroke-width="6" fill="none"/>
  <path d="M52 0 L130 140" stroke="#4e3620" stroke-width="3.5" fill="none"/>
  <!-- Strap 2 stitching -->
  <path d="M50 2 L128 142" stroke="#2a1c10" stroke-width="0.8" stroke-dasharray="2,3" fill="none" opacity="0.5"/>
  <!-- Horizontal chest strap -->
  <rect x="28" y="60" width="136" height="10" rx="2" fill="#3a2818" stroke="#0a0a0a" stroke-width="1.5"/>
  <rect x="28" y="62" width="136" height="5" rx="1" fill="#4e3620" opacity="0.6"/>
  <!-- Chest strap stitching -->
  <line x1="32" y1="65" x2="160" y2="65" stroke="#2a1c10" stroke-width="0.6" stroke-dasharray="2,2" opacity="0.5"/>
  <!-- Brass buckle on strap 1 (upper) -->
  <rect x="106" y="44" width="12" height="10" rx="2" fill="#8a7a40" stroke="#0a0a0a" stroke-width="1.2"/>
  <line x1="109" y1="44" x2="109" y2="54" stroke="#6a5a30" stroke-width="1"/>
  <circle cx="114" cy="49" r="1.5" fill="#6a5a30"/>
  <!-- Brass buckle on chest strap -->
  <rect x="90" y="58" width="14" height="14" rx="2" fill="#8a7a40" stroke="#0a0a0a" stroke-width="1.2"/>
  <circle cx="97" cy="65" r="3" fill="none" stroke="#6a5a30" stroke-width="1.5"/>
  <line x1="97" y1="62" x2="97" y2="68" stroke="#6a5a30" stroke-width="1.2"/>
  <!-- Brass buckle on strap 2 -->
  <rect x="78" y="48" width="10" height="8" rx="1.5" fill="#8a7a40" stroke="#0a0a0a" stroke-width="1"/>
  <circle cx="83" cy="52" r="1.2" fill="#6a5a30"/>
  <!-- Small brass rivets along straps -->
  <circle cx="120" cy="28" r="1.5" fill="#8a7a40" stroke="#0a0a0a" stroke-width="0.5"/>
  <circle cx="108" cy="60" r="1.5" fill="#8a7a40" stroke="#0a0a0a" stroke-width="0.5"/>
  <circle cx="68" cy="30" r="1.5" fill="#8a7a40" stroke="#0a0a0a" stroke-width="0.5"/>
  <circle cx="80" cy="60" r="1.5" fill="#8a7a40" stroke="#0a0a0a" stroke-width="0.5"/>
  <!-- Collar — dark leather -->
  <path d="M36 0 Q96 12 156 0 Q156 14 96 20 Q36 14 36 0Z" fill="#2e1c10" stroke="#0a0a0a" stroke-width="2"/>
  <path d="M40 2 Q96 12 152 2 Q152 10 96 16 Q40 10 40 2Z" fill="#3a2818" opacity="0.5"/>
  <!-- Left shadow overlay -->
  <path d="M24 0 Q20 4 16 20 L8 176 L60 176 L50 20 Q48 4 46 0Z" fill="#0a0a0a" opacity="0.2"/>
  <!-- Left cross-hatching shadow -->
  <path d="M24 0 Q20 4 16 20 L8 176 L60 176 L50 20 Q48 4 46 0Z" fill="url(#crossHatch)"/>
  <!-- Belly area slight highlight -->
  <ellipse cx="96" cy="120" rx="30" ry="20" fill="#5a4430" opacity="0.15"/>
  <!-- Bottom hem detail -->
  <path d="M8 168 L184 168" stroke="#2a1c10" stroke-width="1.5" opacity="0.5"/>
  <path d="M8 172 L184 172" stroke="#2a1c10" stroke-width="1" opacity="0.3"/>
  <!-- Wear marks on leather -->
  <path d="M70 90 L74 92" stroke="#6a5a40" stroke-width="0.6" opacity="0.3"/>
  <path d="M110 100 L116 98" stroke="#6a5a40" stroke-width="0.6" opacity="0.3"/>
  <path d="M60 130 L66 128" stroke="#6a5a40" stroke-width="0.6" opacity="0.3"/>
</svg>
