<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 144" width="56" height="144">
  <defs>
    <linearGradient id="rsGuardGrad" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#2e1c10"/>
      <stop offset="40%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#4e3620"/>
    </linearGradient>
    <linearGradient id="rsHoseGrad" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#0f1e0d"/>
      <stop offset="50%" stop-color="#1a3018"/>
      <stop offset="100%" stop-color="#2a4422"/>
    </linearGradient>
    <pattern id="rsGrain" patternUnits="userSpaceOnUse" width="5" height="5">
      <circle cx="2" cy="3" r="0.3" fill="#0a0a0a" opacity="0.12"/>
      <circle cx="4" cy="1" r="0.25" fill="#0a0a0a" opacity="0.08"/>
    </pattern>
    <pattern id="rsHatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(-40)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#0a0a0a" stroke-width="0.5" opacity="0.12"/>
    </pattern>
  </defs>
  <!-- Dark green hose base -->
  <rect x="6" y="0" width="44" height="144" rx="10" fill="url(#rsHoseGrad)" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Hose fabric folds -->
  <path d="M40 20 Q36 40 42 60" stroke="#0f1e0d" stroke-width="1.2" fill="none" opacity="0.35"/>
  <path d="M38 70 Q34 90 40 110" stroke="#0f1e0d" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M16 30 Q20 50 14 70" stroke="#2a4422" stroke-width="0.8" fill="none" opacity="0.25"/>
  <!-- Shadow side (right, lighter) -->
  <rect x="36" y="0" width="14" height="144" rx="8" fill="#0a0a0a" opacity="0.1"/>
  <rect x="36" y="0" width="14" height="144" rx="8" fill="url(#rsHatch)"/>
  <!-- Leather shin guard -->
  <rect x="4" y="16" width="48" height="80" rx="10" fill="url(#rsGuardGrad)" stroke="#0a0a0a" stroke-width="2.5"/>
  <!-- Shin guard grain -->
  <rect x="4" y="16" width="48" height="80" rx="10" fill="url(#rsGrain)"/>
  <!-- Shin guard shadow -->
  <rect x="36" y="16" width="16" height="80" rx="8" fill="#0a0a0a" opacity="0.1"/>
  <!-- Top buckle strap -->
  <rect x="2" y="18" width="52" height="7" rx="2" fill="#4e3620" stroke="#0a0a0a" stroke-width="1.2"/>
  <rect x="6" y="16" width="10" height="9" rx="2" fill="#8a7a40" stroke="#0a0a0a" stroke-width="1"/>
  <circle cx="11" cy="21" r="1.5" fill="#6a5a30"/>
  <!-- Middle strap -->
  <rect x="2" y="50" width="52" height="7" rx="2" fill="#4e3620" stroke="#0a0a0a" stroke-width="1.2"/>
  <rect x="6" y="48" width="10" height="9" rx="2" fill="#8a7a40" stroke="#0a0a0a" stroke-width="1"/>
  <circle cx="11" cy="53" r="1.5" fill="#6a5a30"/>
  <!-- Bottom buckle strap -->
  <rect x="2" y="84" width="52" height="7" rx="2" fill="#4e3620" stroke="#0a0a0a" stroke-width="1.2"/>
  <rect x="6" y="82" width="10" height="9" rx="2" fill="#8a7a40" stroke="#0a0a0a" stroke-width="1"/>
  <circle cx="11" cy="87" r="1.5" fill="#6a5a30"/>
  <!-- Guard center seam -->
  <line x1="28" y1="20" x2="28" y2="92" stroke="#2a1c10" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.4"/>
  <!-- Highlight strip -->
  <rect x="22" y="24" width="6" height="60" rx="3" fill="#4e3620" opacity="0.1"/>
  <!-- Scuff/wear marks -->
  <path d="M30 36 L34 38" stroke="#5a4430" stroke-width="0.6" opacity="0.3"/>
  <path d="M32 66 L36 64" stroke="#5a4430" stroke-width="0.6" opacity="0.25"/>
  <!-- Ankle detail -->
  <path d="M18 120 Q28 118 40 120" stroke="#0f1e0d" stroke-width="1" fill="none" opacity="0.3"/>
  <!-- Lower hose wrapping -->
  <path d="M10 110 Q28 106 46 110" stroke="#1a3018" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M12 130 Q28 126 44 130" stroke="#1a3018" stroke-width="1" fill="none" opacity="0.25"/>
</svg>
