<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 144" width="56" height="144">
  <defs>
    <linearGradient id="rsGrad" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="60%" stop-color="#182840"/>
      <stop offset="100%" stop-color="#0e1830"/>
    </linearGradient>
    <linearGradient id="rsShadow" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#0a1020" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a1020" stop-opacity="0"/>
    </linearGradient>
    <pattern id="rsHatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(48)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#0a1020" stroke-width="0.5" opacity="0.2"/>
    </pattern>
  </defs>
  <!-- Lower robe — right shin -->
  <path d="M6 4 Q14 0 28 0 Q42 0 50 4 L52 35 Q54 70 52 105 L48 132 Q42 144 28 144 Q14 144 6 132 L4 105 Q2 70 4 35 Z" fill="url(#rsGrad)" stroke="#0a0a0a" stroke-width="2"/>
