  <path d="M28 0 Q42 0 50 4 L52 35 Q54 70 52 105 L48 132 Q42 144 28 144 Z" fill="url(#rsHatch)" opacity="0.35"/>
  <!-- Shadow overlay right -->
  <path d="M42 0 Q42 0 50 4 L52 35 Q54 70 52 105 L48 132 Q42 144 42 144 Z" fill="url(#rsShadow)"/>
  <!-- Vertical fold lines -->
  <path d="M12 6 Q10 35 12 70 Q14 105 12 138" stroke="#0e1830" stroke-width="0.8" fill="none" opacity="0.3"/>
  <path d="M20 4 Q18 35 20 70 Q22 105 20 142" stroke="#0e1830" stroke-width="0.8" fill="none" opacity="0.35"/>
  <path d="M32 4 Q30 35 32 70 Q34 105 32 142" stroke="#0e1830" stroke-width="0.8" fill="none" opacity="0.35"/>
  <path d="M42 6 Q40 35 42 70 Q44 105 42 138" stroke="#0e1830" stroke-width="1" fill="none" opacity="0.45"/>
  <!-- Horizontal drape -->
  <path d="M6 35 Q16 32 30 34 Q44 36 50 38" stroke="#0e1830" stroke-width="0.5" fill="none" opacity="0.25"/>
  <path d="M6 75 Q16 72 30 74 Q44 76 50 78" stroke="#0e1830" stroke-width="0.5" fill="none" opacity="0.2"/>
  <!-- Cloth wrapping at bottom -->
  <path d="M8 120 Q14 118 28 118 Q42 118 48 120" stroke="#243660" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M10 126 Q14 124 28 124 Q42 124 46 126" stroke="#243660" stroke-width="0.8" fill="none" opacity="0.35"/>
  <path d="M12 132 Q18 130 28 130 Q38 130 44 132" stroke="#243660" stroke-width="0.6" fill="none" opacity="0.3"/>
  <!-- Wrapping band -->
  <path d="M8 118 Q14 114 28 114 Q42 114 48 118 L48 124 Q42 120 28 120 Q14 120 8 124 Z" fill="#1e3050" stroke="#0a0a0a" stroke-width="1" opacity="0.5"/>
  <!-- Light highlight near side -->
  <path d="M10 10 Q8 40 10 80 Q12 110 10 136" stroke="#243660" stroke-width="0.5" fill="none" opacity="0.3"/>
  <!-- Outline reinforcement -->
  <path d="M6 4 Q14 0 28 0 Q42 0 50 4 L52 35 Q54 70 52 105 L48 132 Q42 144 28 144 Q14 144 6 132 L4 105 Q2 70 4 35 Z" fill="none" stroke="#0a0a0a" stroke-width="2"/>
</svg>
