  <circle cx="24" cy="45" r="5" fill="none" stroke="#a08830" stroke-width="0.8" opacity="0.5"/>
  <line x1="24" y1="40" x2="24" y2="50" stroke="#a08830" stroke-width="0.8" opacity="0.5"/>
  <line x1="19" y1="45" x2="29" y2="45" stroke="#a08830" stroke-width="0.8" opacity="0.5"/>
  <!-- Light highlight on near side -->
  <path d="M10 10 Q8 35 10 65 Q12 85 10 98" stroke="#243660" stroke-width="0.6" fill="none" opacity="0.3"/>
  <!-- Outline reinforcement -->
  <path d="M4 4 Q12 0 24 0 Q36 0 44 4 L46 30 Q48 55 46 80 L42 96 Q36 104 24 104 Q12 104 6 96 L2 80 Q0 55 2 30 Z" fill="none" stroke="#0a0a0a" stroke-width="2"/>
