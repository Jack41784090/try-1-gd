  <path d="M14 6 Q12 30 14 60 Q16 80 14 100" stroke="#0e1830" stroke-width="1" fill="none" opacity="0.45"/>
  <path d="M26 4 Q24 30 26 60 Q28 85 26 100" stroke="#0e1830" stroke-width="0.8" fill="none" opacity="0.35"/>
  <path d="M36 8 Q34 30 36 60 Q38 80 36 100" stroke="#0e1830" stroke-width="0.8" fill="none" opacity="0.35"/>
