  <path d="M8 90 Q20 88 40 90 Q52 92 58 94" stroke="#0e1830" stroke-width="0.6" fill="none" opacity="0.25"/>
  <path d="M6 140 Q20 138 40 140 Q52 142 58 144" stroke="#0e1830" stroke-width="0.6" fill="none" opacity="0.25"/>
  <!-- Fabric gathering at knee hint -->
  <path d="M12 120 Q22 116 36 118 Q48 120 56 124" stroke="#243660" stroke-width="0.5" fill="none" opacity="0.3"/>
  <!-- Bottom hem -->
  <path d="M6 184 Q16 190 32 192 Q48 190 58 184" stroke="#0e1830" stroke-width="1.2" fill="none" opacity="0.6"/>
  <!-- Outline reinforcement -->
  <path d="M6 4 Q16 0 32 0 Q48 0 58 4 L62 50 Q64 100 62 150 L58 184 Q50 192 32 192 Q14 192 6 184 L2 150 Q0 100 2 50 Z" fill="none" stroke="#0a0a0a" stroke-width="2"/>
</svg>
