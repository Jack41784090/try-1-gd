<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 192" width="64" height="192">
  <defs>
    <linearGradient id="llGrad" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#0e1830"/>
      <stop offset="50%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#152240"/>
    </linearGradient>
    <linearGradient id="llShadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a1020" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a1020" stop-opacity="0"/>
    </linearGradient>
    <pattern id="llHatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(42)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#0a1020" stroke-width="0.5" opacity="0.25"/>
    </pattern>
  </defs>
