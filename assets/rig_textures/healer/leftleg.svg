  <path d="M16 8 Q18 50 16 100 Q14 150 16 186" stroke="#0e1830" stroke-width="1.2" fill="none" opacity="0.5"/>
  <path d="M28 4 Q30 50 28 100 Q26 150 28 190" stroke="#0e1830" stroke-width="1" fill="none" opacity="0.4"/>
