      <stop offset="0%" stop-color="#0e1830"/>
      <stop offset="50%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#152240"/>
    </linearGradient>
    <pattern id="lfaHatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#0a1020" stroke-width="0.5" opacity="0.25"/>
