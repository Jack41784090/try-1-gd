<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <radialGradient id="rhGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#60a0a0" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#60a0a0" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#60a0a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rhSkin" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e8dcc8"/>
      <stop offset="100%" stop-color="#d4c8b0"/>
    </radialGradient>
  </defs>
  <!-- Luminous glow around hand -->
  <ellipse cx="20" cy="20" rx="20" ry="20" fill="url(#rhGlow)"/>
  <!-- Palm base (mirrored) -->
  <path d="M30 8 Q32 14 32 22 Q32 30 28 36 Q24 40 16 40 Q10 38 8 32 Q6 22 8 14 Q10 8 14 6 Z" fill="url(#rhSkin)" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Thumb (mirrored) -->
  <path d="M30 14 Q34 12 35 8 Q36 4 32 3 Q28 3 28 8 L28 14" fill="#e0d4c0" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Finger lines -->
  <line x1="24" y1="6" x2="24" y2="2" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="19" y1="4" x2="19" y2="0" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="5" x2="13" y2="1" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="8" x2="8" y2="4" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Finger tips -->
  <ellipse cx="24" cy="2" rx="2.5" ry="3" fill="#e0d4c0" stroke="#0a0a0a" stroke-width="1.5"/>
  <ellipse cx="19" cy="0" rx="2.5" ry="3" fill="#e0d4c0" stroke="#0a0a0a" stroke-width="1.5"/>
  <ellipse cx="13" cy="1" rx="2.5" ry="3" fill="#e0d4c0" stroke="#0a0a0a" stroke-width="1.5"/>
  <ellipse cx="8" cy="4" rx="2.5" ry="3" fill="#e0d4c0" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Knuckle lines -->
  <path d="M22 12 Q24 10 26 12" stroke="#c0b4a0" stroke-width="0.8" fill="none"/>
  <path d="M17 10 Q19 8 21 10" stroke="#c0b4a0" stroke-width="0.8" fill="none"/>
  <path d="M12 11 Q14 9 16 11" stroke="#c0b4a0" stroke-width="0.8" fill="none"/>
  <!-- Palm creases -->
  <path d="M28 20 Q22 18 12 22" stroke="#c0b4a0" stroke-width="0.6" fill="none" opacity="0.5"/>
  <path d="M28 26 Q22 24 14 28" stroke="#c0b4a0" stroke-width="0.6" fill="none" opacity="0.5"/>
  <!-- Shadow on palm -->
  <path d="M30 20 Q28 28 26 34 Q22 38 18 38" fill="#c0b4a0" opacity="0.2"/>
  <!-- Fingertip glow — subtle teal -->
  <circle cx="24" cy="1" r="3" fill="#60a0a0" opacity="0.12"/>
  <circle cx="19" cy="-1" r="3" fill="#60a0a0" opacity="0.12"/>
  <circle cx="13" cy="0" r="3" fill="#60a0a0" opacity="0.12"/>
  <circle cx="8" cy="3" r="3" fill="#60a0a0" opacity="0.12"/>
</svg>
