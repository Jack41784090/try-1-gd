<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 104" width="88" height="104">
  <defs>
    <radialGradient id="head-shadow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#2a0a10" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2a0a10" stop-opacity="0.35"/>
    </radialGradient>
    <linearGradient id="turban-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1018"/>
      <stop offset="100%" stop-color="#2a0a10"/>
    </linearGradient>
    <linearGradient id="wrap-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a2028"/>
      <stop offset="100%" stop-color="#2a0a10"/>
    </linearGradient>
  </defs>
  <!-- Turban/skullcap base -->
  <ellipse cx="44" cy="30" rx="38" ry="30" fill="url(#turban-grad)" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Turban folds -->
  <path d="M12 28 Q28 18 44 22 Q60 18 76 28" fill="none" stroke="#1a0810" stroke-width="2" opacity="0.6"/>
  <path d="M16 36 Q30 26 44 30 Q58 26 72 36" fill="none" stroke="#1a0810" stroke-width="1.5" opacity="0.5"/>
  <path d="M20 22 Q32 12 44 16 Q56 12 68 22" fill="none" stroke="#1a0810" stroke-width="1.5" opacity="0.4"/>
  <!-- Turban cross-hatching texture -->
  <line x1="24" y1="14" x2="28" y2="26" stroke="#1a0810" stroke-width="0.8" opacity="0.3"/>
  <line x1="36" y1="10" x2="38" y2="24" stroke="#1a0810" stroke-width="0.8" opacity="0.3"/>
  <line x1="50" y1="10" x2="52" y2="24" stroke="#1a0810" stroke-width="0.8" opacity="0.3"/>
  <line x1="62" y1="14" x2="60" y2="26" stroke="#1a0810" stroke-width="0.8" opacity="0.3"/>
  <!-- Arcane symbol on forehead -->
  <circle cx="44" cy="24" r="6" fill="none" stroke="#6a3050" stroke-width="1.2" opacity="0.7"/>
  <polygon points="44,18 47,27 41,27" fill="none" stroke="#6a3050" stroke-width="1" opacity="0.6"/>
  <circle cx="44" cy="24" r="2" fill="#6a3050" opacity="0.4"/>
  <!-- Face area - pale skin around eyes -->
  <path d="M14 40 Q14 56 20 62 Q44 58 68 62 Q74 56 74 40 Q74 34 44 32 Q14 34 14 40Z" fill="#c0a880" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Dark eye sockets/kohl circles -->
  <ellipse cx="30" cy="48" rx="11" ry="9" fill="#1a0f10" opacity="0.5"/>
  <ellipse cx="58" cy="48" rx="11" ry="9" fill="#1a0f10" opacity="0.5"/>
  <!-- Eye whites -->
  <ellipse cx="30" cy="48" rx="8" ry="5" fill="#e8e0d0"/>
  <ellipse cx="58" cy="48" rx="8" ry="5" fill="#e8e0d0"/>
  <!-- Irises - intense green with arcane glow -->
  <ellipse cx="30" cy="48" rx="4.5" ry="4.5" fill="#2a6a30"/>
  <ellipse cx="58" cy="48" rx="4.5" ry="4.5" fill="#2a6a30"/>
  <!-- Pupils -->
  <ellipse cx="30" cy="48" rx="2" ry="2.5" fill="#0a0a0a"/>
  <ellipse cx="58" cy="48" rx="2" ry="2.5" fill="#0a0a0a"/>
  <!-- Eldritch eye glow -->
  <ellipse cx="30" cy="47" rx="6" ry="4" fill="#40a060" opacity="0.08"/>
  <ellipse cx="58" cy="47" rx="6" ry="4" fill="#40a060" opacity="0.08"/>
  <!-- Eye highlights -->
  <circle cx="32" cy="46" r="1.2" fill="#f0f0e0" opacity="0.8"/>
  <circle cx="60" cy="46" r="1.2" fill="#f0f0e0" opacity="0.8"/>
  <!-- Dark brow lines -->
  <path d="M18 40 Q24 36 38 39" stroke="#0a0a0a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M50 39 Q64 36 70 40" stroke="#0a0a0a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Face wrappings covering lower face -->
  <path d="M14 56 Q14 72 20 82 Q32 92 44 94 Q56 92 68 82 Q74 72 74 56" fill="url(#wrap-grad)" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Wrapping band lines -->
  <path d="M16 62 Q44 58 72 62" fill="none" stroke="#1a0810" stroke-width="1.2" opacity="0.6"/>
  <path d="M18 70 Q44 66 70 70" fill="none" stroke="#1a0810" stroke-width="1.2" opacity="0.5"/>
  <path d="M22 78 Q44 74 66 78" fill="none" stroke="#1a0810" stroke-width="1.2" opacity="0.5"/>
  <path d="M28 86 Q44 82 60 86" fill="none" stroke="#1a0810" stroke-width="1" opacity="0.4"/>
  <!-- Cross-hatching on wraps -->
  <line x1="24" y1="60" x2="28" y2="78" stroke="#1a0810" stroke-width="0.7" opacity="0.25"/>
  <line x1="36" y1="58" x2="38" y2="80" stroke="#1a0810" stroke-width="0.7" opacity="0.25"/>
  <line x1="50" y1="58" x2="52" y2="80" stroke="#1a0810" stroke-width="0.7" opacity="0.25"/>
  <line x1="62" y1="60" x2="60" y2="78" stroke="#1a0810" stroke-width="0.7" opacity="0.25"/>
  <!-- Chemical stain on wrapping -->
  <ellipse cx="56" cy="72" rx="6" ry="4" fill="#2a4a20" opacity="0.25"/>
  <ellipse cx="26" cy="80" rx="4" ry="3" fill="#4a6a30" opacity="0.15"/>
  <!-- Shadow overlay -->
  <ellipse cx="44" cy="60" rx="38" ry="40" fill="url(#head-shadow)"/>
  <!-- Outline reinforcement -->
  <ellipse cx="44" cy="30" rx="38" ry="30" fill="none" stroke="#0a0a0a" stroke-width="2"/>
</svg>
