<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 48" width="96" height="48">
  <defs>
    <linearGradient id="lfoot-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a1018"/>
      <stop offset="100%" stop-color="#2a0a10"/>
    </linearGradient>
    <linearGradient id="lfoot-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0406" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0406" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <!-- Pointed slipper sole shadow -->
  <ellipse cx="48" cy="44" rx="42" ry="4" fill="#0a0406" opacity="0.2"/>
  <!-- Shoe body -->
  <path d="M40 4 Q30 4 24 10 L10 20 Q2 26 0 32 Q-2 38 4 40 Q10 44 20 44 L76 44 Q86 44 90 38 Q92 32 88 26 L80 16 Q76 8 70 4Z" fill="url(#lfoot-grad)" stroke="#0a0a0a" stroke-width="2.5"/>
  <!-- Pointed curled toe -->
  <path d="M0 32 Q-4 28 -2 22 Q0 16 6 14 Q10 14 12 18" fill="url(#lfoot-grad)" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Toe curl spiral -->
  <path d="M2 22 Q0 18 4 16 Q8 16 8 20" fill="none" stroke="#1a0608" stroke-width="1" opacity="0.5"/>
  <!-- Shoe seam line -->
  <path d="M40 6 Q30 18 12 28" fill="none" stroke="#0a0a0a" stroke-width="1" opacity="0.4"/>
  <!-- Top opening -->
  <path d="M40 4 Q55 2 70 4" fill="none" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Leather texture fold lines -->
  <path d="M50 10 Q46 20 42 30" fill="none" stroke="#1a0608" stroke-width="0.8" opacity="0.35"/>
  <path d="M62 8 Q58 18 56 28" fill="none" stroke="#1a0608" stroke-width="0.8" opacity="0.3"/>
  <path d="M30 14 Q26 24 24 34" fill="none" stroke="#1a0608" stroke-width="0.8" opacity="0.3"/>
  <!-- Arcane symbol on toe area -->
  <circle cx="20" cy="30" r="4" fill="none" stroke="#5a3850" stroke-width="0.6" opacity="0.25"/>
  <polygon points="20,26 23,33 17,33" fill="none" stroke="#5a3850" stroke-width="0.5" opacity="0.2"/>
  <!-- Chemical stain -->
  <ellipse cx="56" cy="28" rx="6" ry="4" fill="#2a4a20" opacity="0.15"/>
  <ellipse cx="34" cy="36" rx="4" ry="3" fill="#4a3a20" opacity="0.12"/>
  <!-- Cross-hatching on heel -->
  <g opacity="0.12" stroke="#0a0a0a" stroke-width="0.5">
    <line x1="70" y1="20" x2="74" y2="36"/>
    <line x1="74" y1="18" x2="78" y2="34"/>
    <line x1="78" y1="16" x2="82" y2="32"/>
  </g>
  <!-- Shadow overlay -->
  <path d="M40 4 Q30 4 24 10 L10 20 Q2 26 0 32 Q-2 38 4 40 Q10 44 20 44 L76 44 Q86 44 90 38 Q92 32 88 26 L80 16 Q76 8 70 4Z" fill="url(#lfoot-shadow)"/>
</svg>
