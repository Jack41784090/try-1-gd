<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" width="160" height="48">
  <defs>
    <linearGradient id="sash-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1840"/>
      <stop offset="50%" stop-color="#2a0a10"/>
      <stop offset="100%" stop-color="#1a0608"/>
    </linearGradient>
    <linearGradient id="sash-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0406" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0406" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <!-- Sash/obi base -->
  <rect x="4" y="4" width="152" height="36" rx="6" ry="6" fill="url(#sash-grad)" stroke="#0a0a0a" stroke-width="2.5"/>
  <!-- Sash fold lines -->
  <path d="M20 8 Q22 24 18 40" fill="none" stroke="#1a0608" stroke-width="1" opacity="0.4"/>
  <path d="M60 6 Q62 24 58 42" fill="none" stroke="#1a0608" stroke-width="1" opacity="0.35"/>
  <path d="M100 6 Q102 24 98 42" fill="none" stroke="#1a0608" stroke-width="1" opacity="0.35"/>
  <path d="M140 8 Q142 24 138 40" fill="none" stroke="#1a0608" stroke-width="1" opacity="0.4"/>
  <!-- Vial pouch 1 -->
  <rect x="26" y="26" width="10" height="16" rx="2" fill="#1a0608" stroke="#0a0a0a" stroke-width="1.5"/>
  <ellipse cx="31" cy="27" rx="4" ry="2" fill="#4a3a28" stroke="#0a0a0a" stroke-width="1"/>
  <circle cx="31" cy="26" r="1.5" fill="#8a9060" opacity="0.5"/>
  <!-- Vial pouch 2 -->
  <rect x="44" y="28" width="8" height="14" rx="2" fill="#1a0608" stroke="#0a0a0a" stroke-width="1.5"/>
  <ellipse cx="48" cy="29" rx="3.5" ry="1.8" fill="#4a3a28" stroke="#0a0a0a" stroke-width="1"/>
  <circle cx="48" cy="28" r="1.2" fill="#40a060" opacity="0.4"/>
  <!-- Vial pouch 3 -->
  <rect x="108" y="26" width="10" height="16" rx="2" fill="#1a0608" stroke="#0a0a0a" stroke-width="1.5"/>
  <ellipse cx="113" cy="27" rx="4" ry="2" fill="#4a3a28" stroke="#0a0a0a" stroke-width="1"/>
  <circle cx="113" cy="26" r="1.5" fill="#6a3050" opacity="0.5"/>
  <!-- Vial pouch 4 -->
  <rect x="124" y="28" width="8" height="14" rx="2" fill="#1a0608" stroke="#0a0a0a" stroke-width="1.5"/>
  <ellipse cx="128" cy="29" rx="3.5" ry="1.8" fill="#4a3a28" stroke="#0a0a0a" stroke-width="1"/>
  <circle cx="128" cy="28" r="1.2" fill="#8a9060" opacity="0.4"/>
  <!-- Center buckle with arcane symbol -->
  <rect x="70" y="10" width="20" height="24" rx="3" fill="#2a1420" stroke="#0a0a0a" stroke-width="1.5"/>
  <circle cx="80" cy="22" r="7" fill="none" stroke="#6a3050" stroke-width="1" opacity="0.6"/>
  <polygon points="80,15 84,25 76,25" fill="none" stroke="#6a3050" stroke-width="0.8" opacity="0.5"/>
  <circle cx="80" cy="22" r="2" fill="#6a3050" opacity="0.3"/>
  <!-- Alchemical symbols on sash -->
  <circle cx="16" cy="18" r="4" fill="none" stroke="#5a3850" stroke-width="0.6" opacity="0.3"/>
  <circle cx="144" cy="18" r="4" fill="none" stroke="#5a3850" stroke-width="0.6" opacity="0.3"/>
  <!-- Chemical stain -->
  <ellipse cx="38" cy="16" rx="5" ry="3" fill="#2a4a20" opacity="0.2"/>
  <!-- Shadow overlay -->
  <rect x="4" y="4" width="152" height="36" rx="6" ry="6" fill="url(#sash-shadow)"/>
</svg>
