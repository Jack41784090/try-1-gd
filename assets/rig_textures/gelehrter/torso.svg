<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 176" width="192" height="176">
  <defs>
    <linearGradient id="robe-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1018"/>
      <stop offset="40%" stop-color="#2a0a10"/>
      <stop offset="100%" stop-color="#1a0608"/>
    </linearGradient>
    <linearGradient id="inner-lining" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a0608"/>
      <stop offset="50%" stop-color="#2a0a10"/>
      <stop offset="100%" stop-color="#1a0608"/>
    </linearGradient>
    <radialGradient id="torso-shadow" cx="50%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#0a0406" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0406" stop-opacity="0.4"/>
    </radialGradient>
    <pattern id="arcane-pattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="6" fill="none" stroke="#6a3050" stroke-width="0.6" opacity="0.3"/>
      <polygon points="16,10 19,19 13,19" fill="none" stroke="#6a3050" stroke-width="0.5" opacity="0.25"/>
    </pattern>
  </defs>
  <!-- Robe body -->
  <path d="M30 4 Q20 8 16 20 L8 60 L4 120 Q4 168 20 172 L172 172 Q188 168 188 120 L184 60 L176 20 Q172 8 162 4 Q130 0 96 0 Q62 0 30 4Z" fill="url(#robe-grad)" stroke="#0a0a0a" stroke-width="2.5"/>
  <!-- Inner darker lining visible at neckline -->
  <path d="M60 4 Q72 16 96 18 Q120 16 132 4 Q120 0 96 0 Q72 0 60 4Z" fill="url(#inner-lining)" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Wide collar -->
  <path d="M50 6 Q60 20 96 22 Q132 20 142 6" fill="none" stroke="#0a0a0a" stroke-width="2"/>
  <path d="M54 8 Q64 18 96 20 Q128 18 138 8" fill="none" stroke="#3a1840" stroke-width="1.5" opacity="0.5"/>
  <!-- Center seam -->
  <line x1="96" y1="18" x2="96" y2="172" stroke="#0a0a0a" stroke-width="1" opacity="0.4"/>
  <!-- Robe fold lines -->
  <path d="M40 30 Q50 80 44 140" fill="none" stroke="#1a0608" stroke-width="1.5" opacity="0.5"/>
  <path d="M152 30 Q142 80 148 140" fill="none" stroke="#1a0608" stroke-width="1.5" opacity="0.5"/>
  <path d="M64 40 Q70 90 66 150" fill="none" stroke="#1a0608" stroke-width="1" opacity="0.35"/>
  <path d="M128 40 Q122 90 126 150" fill="none" stroke="#1a0608" stroke-width="1" opacity="0.35"/>
  <!-- Arcane geometric symbols -->
  <rect x="96" y="172" width="0" height="0" fill="url(#arcane-pattern)"/>
  <!-- Large arcane circle on chest -->
  <circle cx="96" cy="60" r="22" fill="none" stroke="#6a3050" stroke-width="1.2" opacity="0.4"/>
  <circle cx="96" cy="60" r="16" fill="none" stroke="#6a3050" stroke-width="0.8" opacity="0.3"/>
  <polygon points="96,38 118,71 74,71" fill="none" stroke="#6a3050" stroke-width="0.8" opacity="0.3"/>
  <polygon points="96,82 74,49 118,49" fill="none" stroke="#6a3050" stroke-width="0.8" opacity="0.3"/>
  <circle cx="96" cy="60" r="5" fill="#6a3050" opacity="0.15"/>
  <!-- Alchemical symbol - mercury -->
  <circle cx="60" cy="110" r="8" fill="none" stroke="#5a4060" stroke-width="0.8" opacity="0.35"/>
  <line x1="60" y1="102" x2="60" y2="92" stroke="#5a4060" stroke-width="0.8" opacity="0.35"/>
  <path d="M54 92 L60 86 L66 92" fill="none" stroke="#5a4060" stroke-width="0.8" opacity="0.3"/>
  <!-- Alchemical symbol - sulfur -->
  <polygon points="132,100 140,114 124,114" fill="none" stroke="#5a4060" stroke-width="0.8" opacity="0.35"/>
  <line x1="132" y1="114" x2="132" y2="126" stroke="#5a4060" stroke-width="0.8" opacity="0.35"/>
  <line x1="126" y1="120" x2="138" y2="120" stroke="#5a4060" stroke-width="0.8" opacity="0.3"/>
  <!-- Small arcane marks scattered -->
  <circle cx="40" cy="50" r="4" fill="none" stroke="#5a3850" stroke-width="0.6" opacity="0.25"/>
  <circle cx="154" cy="46" r="3.5" fill="none" stroke="#5a3850" stroke-width="0.6" opacity="0.25"/>
  <polygon points="42,140 46,148 38,148" fill="none" stroke="#5a3850" stroke-width="0.6" opacity="0.2"/>
  <polygon points="150,136 154,144 146,144" fill="none" stroke="#5a3850" stroke-width="0.6" opacity="0.2"/>
  <!-- Alchemical stain splotches -->
  <ellipse cx="70" cy="80" rx="12" ry="8" fill="#2a4a20" opacity="0.2"/>
  <ellipse cx="74" cy="84" rx="6" ry="4" fill="#3a5a28" opacity="0.15"/>
  <ellipse cx="140" cy="130" rx="10" ry="14" fill="#2a4a20" opacity="0.18"/>
  <ellipse cx="50" cy="150" rx="8" ry="6" fill="#4a3a20" opacity="0.15"/>
  <ellipse cx="120" cy="70" rx="5" ry="7" fill="#3a4a28" opacity="0.12"/>
  <!-- Cross-hatching for texture -->
  <g opacity="0.15" stroke="#0a0a0a" stroke-width="0.5">
    <line x1="20" y1="80" x2="30" y2="100"/>
    <line x1="24" y1="78" x2="34" y2="98"/>
    <line x1="28" y1="76" x2="38" y2="96"/>
    <line x1="160" y1="80" x2="170" y2="100"/>
    <line x1="156" y1="78" x2="166" y2="98"/>
    <line x1="152" y1="76" x2="162" y2="96"/>
    <line x1="80" y1="140" x2="90" y2="160"/>
    <line x1="84" y1="138" x2="94" y2="158"/>
    <line x1="100" y1="140" x2="110" y2="160"/>
    <line x1="104" y1="138" x2="114" y2="158"/>
  </g>
  <!-- Shadow overlay -->
  <path d="M30 4 Q20 8 16 20 L8 60 L4 120 Q4 168 20 172 L172 172 Q188 168 188 120 L184 60 L176 20 Q172 8 162 4 Q130 0 96 0 Q62 0 30 4Z" fill="url(#torso-shadow)"/>
</svg>
