<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 192" width="64" height="192">
  <defs>
    <linearGradient id="rleg-grad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e0e14"/>
      <stop offset="100%" stop-color="#1e0a0c"/>
    </linearGradient>
    <linearGradient id="rleg-shadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0406" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0406" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="rleg-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#0a0406" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </defs>
  <!-- Robe skirt piece -->
  <path d="M4 0 Q0 4 0 16 L0 160 Q0 184 12 190 L52 190 Q62 184 62 160 L64 16 Q64 4 60 0Z" fill="url(#rleg-grad)" stroke="#0a0a0a" stroke-width="2.5"/>
  <!-- Fabric drape folds -->
  <path d="M16 0 Q20 60 12 130" fill="none" stroke="#0a0406" stroke-width="1.5" opacity="0.35"/>
  <path d="M38 0 Q42 70 34 140" fill="none" stroke="#0a0406" stroke-width="1.2" opacity="0.3"/>
  <path d="M52 0 Q54 50 50 120" fill="none" stroke="#0a0406" stroke-width="1" opacity="0.25"/>
  <path d="M26 20 Q30 80 22 150" fill="none" stroke="#0a0406" stroke-width="0.8" opacity="0.2"/>
  <!-- Arcane hem pattern -->
  <circle cx="16" cy="172" r="5" fill="none" stroke="#6a3050" stroke-width="0.7" opacity="0.28"/>
  <circle cx="32" cy="176" r="6" fill="none" stroke="#6a3050" stroke-width="0.8" opacity="0.3"/>
  <circle cx="48" cy="172" r="5" fill="none" stroke="#6a3050" stroke-width="0.7" opacity="0.28"/>
  <polygon points="32,170 36,180 28,180" fill="none" stroke="#6a3050" stroke-width="0.6" opacity="0.22"/>
  <path d="M10 174 Q32 168 54 174" fill="none" stroke="#5a3850" stroke-width="0.6" opacity="0.2"/>
  <!-- Mid-robe arcane symbol -->
  <polygon points="36,50 42,66 30,66" fill="none" stroke="#5a3850" stroke-width="0.6" opacity="0.2"/>
  <circle cx="36" cy="58" r="5" fill="none" stroke="#5a3850" stroke-width="0.5" opacity="0.18"/>
  <!-- Chemical splatter -->
  <ellipse cx="40" cy="100" rx="8" ry="10" fill="#2a4a20" opacity="0.16"/>
  <ellipse cx="18" cy="76" rx="6" ry="9" fill="#3a5a28" opacity="0.12"/>
  <ellipse cx="48" cy="140" rx="5" ry="6" fill="#4a3a20" opacity="0.12"/>
  <circle cx="24" cy="120" r="4" fill="#2a4a20" opacity="0.1"/>
  <!-- Cross-hatching -->
  <rect x="0" y="140" width="64" height="50" fill="url(#rleg-hatch)"/>
  <g opacity="0.12" stroke="#0a0a0a" stroke-width="0.5">
    <line x1="6" y1="150" x2="10" y2="170"/>
    <line x1="10" y1="148" x2="14" y2="168"/>
    <line x1="52" y1="152" x2="56" y2="172"/>
    <line x1="56" y1="150" x2="60" y2="170"/>
  </g>
  <!-- Shadow overlay -->
  <path d="M4 0 Q0 4 0 16 L0 160 Q0 184 12 190 L52 190 Q62 184 62 160 L64 16 Q64 4 60 0Z" fill="url(#rleg-shadow)"/>
</svg>
