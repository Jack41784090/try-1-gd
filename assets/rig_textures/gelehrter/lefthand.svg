<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <radialGradient id="lh-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#40a060" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#40a060" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lh-shadow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#2a0a10" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2a0a10" stop-opacity="0.3"/>
    </radialGradient>
  </defs>
  <!-- Eldritch glow underneath -->
  <circle cx="20" cy="20" r="18" fill="url(#lh-glow)"/>
  <!-- Palm -->
  <ellipse cx="20" cy="22" rx="12" ry="10" fill="#c0a880" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Fingers - slightly elongated -->
  <path d="M10 14 Q9 6 10 2 Q12 0 14 2 Q14 6 14 14" fill="#b8a078" stroke="#0a0a0a" stroke-width="1.5"/>
  <path d="M15 12 Q15 4 16 0 Q18 -1 20 0 Q20 4 19 12" fill="#b8a078" stroke="#0a0a0a" stroke-width="1.5"/>
  <path d="M21 12 Q22 4 23 1 Q25 0 27 1 Q26 4 25 12" fill="#b8a078" stroke="#0a0a0a" stroke-width="1.5"/>
  <path d="M27 14 Q28 8 29 4 Q31 3 32 5 Q31 9 30 14" fill="#b8a078" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Thumb -->
  <path d="M8 20 Q4 18 3 14 Q3 12 5 12 Q8 14 10 18" fill="#b8a078" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Chemical burn stains -->
  <ellipse cx="16" cy="20" rx="3" ry="2" fill="#8a9060" opacity="0.35"/>
  <ellipse cx="24" cy="18" rx="2" ry="3" fill="#6a7a40" opacity="0.25"/>
  <circle cx="12" cy="8" r="1.5" fill="#7a8a50" opacity="0.3"/>
  <!-- Knuckle lines -->
  <line x1="12" y1="14" x2="14" y2="14" stroke="#8a7858" stroke-width="0.6" opacity="0.4"/>
  <line x1="17" y1="12" x2="19" y2="12" stroke="#8a7858" stroke-width="0.6" opacity="0.4"/>
  <line x1="23" y1="12" x2="25" y2="12" stroke="#8a7858" stroke-width="0.6" opacity="0.4"/>
  <!-- Arcane trace on palm -->
  <circle cx="20" cy="24" r="4" fill="none" stroke="#40a060" stroke-width="0.5" opacity="0.2"/>
  <!-- Shadow -->
  <ellipse cx="20" cy="22" rx="12" ry="10" fill="url(#lh-shadow)"/>
