<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="rhSteel" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a42"/>
      <stop offset="40%" stop-color="#4a4a52"/>
      <stop offset="100%" stop-color="#2a2a30"/>
    </linearGradient>
    <pattern id="rhHatch" patternUnits="userSpaceOnUse" width="3" height="3" patternTransform="rotate(-40)">
      <line x1="0" y1="0" x2="0" y2="3" stroke="#1a1a2a" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>
  <!-- Gauntlet base -->
  <path d="M6 4 Q6 0 12 0 L28 0 Q34 0 34 4 L36 28 Q36 36 28 38 L12 38 Q4 36 4 28Z" fill="url(#rhSteel)" stroke="#0a0a0a" stroke-width="2"/>
  <path d="M6 4 Q6 0 12 0 L28 0 Q34 0 34 4 L36 28 Q36 36 28 38 L12 38 Q4 36 4 28Z" fill="url(#rhHatch)"/>
  <!-- Finger plates -->
  <rect x="6" y="20" width="7" height="10" rx="1" fill="#3a3a42" stroke="#0a0a0a" stroke-width="1"/>
  <rect x="14" y="18" width="6" height="14" rx="1" fill="#3a3a42" stroke="#0a0a0a" stroke-width="1"/>
  <rect x="21" y="18" width="6" height="14" rx="1" fill="#3a3a42" stroke="#0a0a0a" stroke-width="1"/>
  <rect x="28" y="20" width="6" height="10" rx="1" fill="#3a3a42" stroke="#0a0a0a" stroke-width="1"/>
  <!-- Finger articulation -->
  <line x1="7" y1="25" x2="12" y2="25" stroke="#1a1a2a" stroke-width="0.7"/>
  <line x1="15" y1="24" x2="19" y2="24" stroke="#1a1a2a" stroke-width="0.7"/>
  <line x1="22" y1="24" x2="26" y2="24" stroke="#1a1a2a" stroke-width="0.7"/>
  <line x1="29" y1="25" x2="33" y2="25" stroke="#1a1a2a" stroke-width="0.7"/>
  <!-- Finger tips -->
  <line x1="7" y1="28" x2="12" y2="28" stroke="#1a1a2a" stroke-width="0.5"/>
  <line x1="15" y1="29" x2="19" y2="29" stroke="#1a1a2a" stroke-width="0.5"/>
  <line x1="22" y1="29" x2="26" y2="29" stroke="#1a1a2a" stroke-width="0.5"/>
  <!-- Knuckle plate -->
  <rect x="6" y="14" width="28" height="6" rx="2" fill="#4a4a52" stroke="#0a0a0a" stroke-width="1.2"/>
  <!-- Knuckle rivets -->
  <circle cx="12" cy="17" r="1" fill="#4a4a52" stroke="#0a0a0a" stroke-width="0.5"/>
  <circle cx="20" cy="17" r="1" fill="#4a4a52" stroke="#0a0a0a" stroke-width="0.5"/>
  <circle cx="28" cy="17" r="1" fill="#4a4a52" stroke="#0a0a0a" stroke-width="0.5"/>
  <!-- Wrist plate -->
  <rect x="4" y="0" width="32" height="8" rx="2" fill="#3a3a42" stroke="#0a0a0a" stroke-width="1.2"/>
  <line x1="4" y1="4" x2="36" y2="4" stroke="#1a1a2a" stroke-width="0.6"/>
  <!-- Sheen on near side -->
  <line x1="8" y1="2" x2="10" y2="14" stroke="#72727a" stroke-width="1.2" opacity="0.45"/>
  <line x1="6" y1="4" x2="8" y2="10" stroke="#8a8a92" stroke-width="0.6" opacity="0.25"/>
  <!-- Shadow -->
  <rect x="24" y="0" width="12" height="38" fill="#0a0a0a" opacity="0.12"/>
  <!-- Scratches -->
  <line x1="14" y1="6" x2="20" y2="12" stroke="#606068" stroke-width="0.5" opacity="0.4"/>
  <line x1="24" y1="8" x2="26" y2="14" stroke="#72727a" stroke-width="0.4" opacity="0.3"/>
  <!-- Rust -->
  <circle cx="30" cy="28" r="1" fill="#6a3a20" opacity="0.25"/>
</svg>