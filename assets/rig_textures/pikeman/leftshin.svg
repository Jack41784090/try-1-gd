<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 144" width="56" height="144">
  <defs>
    <linearGradient id="lsSteel" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="40%" stop-color="#3a3a42"/>
      <stop offset="100%" stop-color="#2a2a30"/>
    </linearGradient>
    <pattern id="lsHatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#1a1a2a" stroke-width="0.4" opacity="0.25"/>
    </pattern>
    <pattern id="lsHatch2" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1a1a2a" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>
  <!-- Leather backing at rear -->
  <rect x="12" y="4" width="32" height="136" rx="8" fill="#2a1a10" stroke="#1a0f08" stroke-width="0.8"/>
  <!-- Main greave plate -->
  <path d="M6 8 Q6 2 14 2 L42 2 Q50 2 50 8 L52 124 Q52 136 42 140 L14 140 Q4 136 4 124Z" fill="url(#lsSteel)" stroke="#0a0a0a" stroke-width="2"/>
  <path d="M6 8 Q6 2 14 2 L42 2 Q50 2 50 8 L52 124 Q52 136 42 140 L14 140 Q4 136 4 124Z" fill="url(#lsHatch)"/>
  <path d="M6 8 Q6 2 14 2 L42 2 Q50 2 50 8 L52 124 Q52 136 42 140 L14 140 Q4 136 4 124Z" fill="url(#lsHatch2)"/>
  <!-- Median ridge down center -->
  <line x1="28" y1="6" x2="28" y2="136" stroke="#606068" stroke-width="1.2" opacity="0.4"/>
  <line x1="29" y1="6" x2="29" y2="136" stroke="#2a2a30" stroke-width="0.8" opacity="0.4"/>
  <!-- Plate articulation -->
  <path d="M8 36 Q28 40 48 36" stroke="#1a1a2a" stroke-width="1" fill="none"/>
  <path d="M6 72 Q28 76 50 72" stroke="#1a1a2a" stroke-width="1" fill="none"/>
  <path d="M6 108 Q28 112 50 108" stroke="#1a1a2a" stroke-width="1" fill="none"/>
  <!-- Sheen -->
  <path d="M42 4 Q48 10 50 36 L50 72" stroke="#72727a" stroke-width="1.5" fill="none" opacity="0.35"/>
  <path d="M44 6 Q48 12 48 30" stroke="#8a8a92" stroke-width="0.8" fill="none" opacity="0.2"/>
  <!-- Rivets -->
  <circle cx="12" cy="10" r="1.3" fill="#4a4a52" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="44" cy="10" r="1.3" fill="#4a4a52" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="12" cy="54" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="44" cy="54" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="12" cy="90" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="44" cy="90" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="12" cy="126" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="44" cy="126" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <!-- Leather straps at back (visible at edges) -->
  <rect x="8" y="24" width="40" height="4" rx="1" fill="#2a1a10" stroke="#1a0f08" stroke-width="0.7"/>
  <rect x="8" y="60" width="40" height="4" rx="1" fill="#2a1a10" stroke="#1a0f08" stroke-width="0.7"/>
  <rect x="8" y="96" width="40" height="4" rx="1" fill="#2a1a10" stroke="#1a0f08" stroke-width="0.7"/>
  <!-- Buckles -->
  <rect x="40" y="23" width="5" height="6" rx="1" fill="#4a4a52" stroke="#0a0a0a" stroke-width="0.6"/>
  <rect x="40" y="59" width="5" height="6" rx="1" fill="#4a4a52" stroke="#0a0a0a" stroke-width="0.6"/>
  <!-- Shadow -->
  <rect x="4" y="2" width="18" height="138" rx="4" fill="#0a0a0a" opacity="0.15"/>
  <!-- Battle scars -->
  <line x1="18" y1="14" x2="28" y2="28" stroke="#606068" stroke-width="0.7" opacity="0.45"/>
  <line x1="20" y1="16" x2="28" y2="26" stroke="#72727a" stroke-width="0.3" opacity="0.25"/>
  <line x1="34" y1="80" x2="40" y2="92" stroke="#606068" stroke-width="0.5" opacity="0.4"/>
  <ellipse cx="22" cy="48" rx="3" ry="4" fill="#1a1a2a" opacity="0.2"/>
  <!-- Deep gouge -->
  <path d="M36 44 L38 56" stroke="#1a1a2a" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M37 44 L39 56" stroke="#606068" stroke-width="0.5" fill="none" opacity="0.3"/>
  <!-- Rust -->
  <circle cx="38" cy="120" r="2" fill="#6a3a20" opacity="0.25"/>
  <circle cx="16" cy="80" r="1.5" fill="#6a3a20" opacity="0.2"/>
</svg>