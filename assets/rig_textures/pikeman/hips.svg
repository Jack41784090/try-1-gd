<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" width="160" height="48">
  <defs>
    <linearGradient id="fauldSteel" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#4a4a52"/>
      <stop offset="50%" stop-color="#3a3a42"/>
      <stop offset="100%" stop-color="#2a2a30"/>
    </linearGradient>
    <pattern id="fHatch" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#1a1a2a" stroke-width="0.4" opacity="0.25"/>
    </pattern>
  </defs>
  <!-- Under-layer -->
  <rect x="4" y="0" width="152" height="46" rx="4" fill="#1a1a2a"/>
  <!-- Top plate -->
  <rect x="6" y="0" width="148" height="14" rx="3" fill="url(#fauldSteel)" stroke="#0a0a0a" stroke-width="2"/>
  <rect x="6" y="0" width="148" height="14" rx="3" fill="url(#fHatch)"/>
  <!-- Second plate -->
  <rect x="8" y="12" width="144" height="12" rx="2" fill="url(#fauldSteel)" stroke="#0a0a0a" stroke-width="1.8"/>
  <rect x="8" y="12" width="144" height="12" rx="2" fill="url(#fHatch)"/>
  <!-- Third plate -->
  <rect x="10" y="22" width="140" height="12" rx="2" fill="url(#fauldSteel)" stroke="#0a0a0a" stroke-width="1.5"/>
  <rect x="10" y="22" width="140" height="12" rx="2" fill="url(#fHatch)"/>
  <!-- Bottom plate -->
  <rect x="12" y="32" width="136" height="12" rx="2" fill="url(#fauldSteel)" stroke="#0a0a0a" stroke-width="1.5"/>
  <rect x="12" y="32" width="136" height="12" rx="2" fill="url(#fHatch)"/>
  <!-- Shadow between plates -->
  <line x1="8" y1="13" x2="152" y2="13" stroke="#0a0a0a" stroke-width="1" opacity="0.5"/>
  <line x1="10" y1="23" x2="150" y2="23" stroke="#0a0a0a" stroke-width="1" opacity="0.5"/>
  <line x1="12" y1="33" x2="148" y2="33" stroke="#0a0a0a" stroke-width="1" opacity="0.5"/>
  <!-- Rivets -->
  <circle cx="16" cy="7" r="1.5" fill="#4a4a52" stroke="#0a0a0a" stroke-width="0.7"/>
  <circle cx="40" cy="7" r="1.5" fill="#4a4a52" stroke="#0a0a0a" stroke-width="0.7"/>
  <circle cx="80" cy="7" r="1.5" fill="#4a4a52" stroke="#0a0a0a" stroke-width="0.7"/>
  <circle cx="120" cy="7" r="1.5" fill="#4a4a52" stroke="#0a0a0a" stroke-width="0.7"/>
  <circle cx="144" cy="7" r="1.5" fill="#4a4a52" stroke="#0a0a0a" stroke-width="0.7"/>
  <circle cx="18" cy="18" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="142" cy="18" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="20" cy="28" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="140" cy="28" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <!-- Sheen highlights -->
  <line x1="100" y1="2" x2="140" y2="2" stroke="#72727a" stroke-width="1" opacity="0.3"/>
  <line x1="102" y1="14" x2="138" y2="14" stroke="#72727a" stroke-width="0.8" opacity="0.25"/>
  <!-- Left shadow -->
  <rect x="6" y="0" width="60" height="46" fill="#0a0a0a" opacity="0.12"/>
  <!-- Scratches -->
  <line x1="60" y1="4" x2="70" y2="10" stroke="#606068" stroke-width="0.5" opacity="0.4"/>
  <line x1="100" y1="26" x2="110" y2="32" stroke="#606068" stroke-width="0.5" opacity="0.35"/>
  <!-- Rust -->
  <circle cx="130" cy="38" r="2" fill="#6a3a20" opacity="0.25"/>
</svg>