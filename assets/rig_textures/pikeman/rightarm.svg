  <circle cx="10" cy="8" r="1.8" fill="#4a4a52" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="28" cy="6" r="1.8" fill="#4a4a52" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="46" cy="8" r="1.8" fill="#4a4a52" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="44" cy="56" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="44" cy="86" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="44" cy="116" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
