<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 144" width="56" height="144">
  <defs>
    <linearGradient id="raSteel" x1="1" y1="0" x2="0" y2="0.5">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="40%" stop-color="#4a4a52"/>
      <stop offset="100%" stop-color="#3a3a42"/>
    </linearGradient>
    <pattern id="raHatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#1a1a2a" stroke-width="0.4" opacity="0.3"/>
    </pattern>
    <pattern id="raHatch2" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(60)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1a1a2a" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>
