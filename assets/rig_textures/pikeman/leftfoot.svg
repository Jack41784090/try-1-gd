<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 48" width="96" height="48">
  <defs>
    <linearGradient id="lfSteel" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="50%" stop-color="#3a3a42"/>
      <stop offset="100%" stop-color="#2a2a30"/>
    </linearGradient>
    <pattern id="lfHatch" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#1a1a2a" stroke-width="0.4" opacity="0.25"/>
    </pattern>
    <pattern id="lfHatch2" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(-40)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#1a1a2a" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>
  <!-- Sole / base -->
  <path d="M8 36 Q4 36 4 32 L4 28 Q4 24 10 22 L82 18 Q92 18 92 24 L92 36 Q92 42 82 44 L20 44 Q8 44 8 36Z" fill="#1a1a22" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Main sabaton plates -->
  <path d="M10 8 Q10 2 20 2 L50 2 Q56 2 56 6 L56 30 Q56 38 46 40 L20 40 Q10 38 10 30Z" fill="url(#lfSteel)" stroke="#0a0a0a" stroke-width="2"/>
  <path d="M10 8 Q10 2 20 2 L50 2 Q56 2 56 6 L56 30 Q56 38 46 40 L20 40 Q10 38 10 30Z" fill="url(#lfHatch)"/>
  <!-- Toe plates - articulated -->
  <path d="M54 10 L78 8 Q86 8 88 14 L90 28 Q90 34 82 36 L56 36" fill="url(#lfSteel)" stroke="#0a0a0a" stroke-width="2"/>
  <path d="M54 10 L78 8 Q86 8 88 14 L90 28 Q90 34 82 36 L56 36" fill="url(#lfHatch2)"/>
  <!-- Steel toe cap -->
  <path d="M76 10 Q90 8 92 18 L92 30 Q90 36 82 36 L76 34" fill="#4a4a52" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Plate articulation lines -->
  <line x1="34" y1="4" x2="34" y2="38" stroke="#1a1a2a" stroke-width="1" opacity="0.6"/>
  <line x1="56" y1="8" x2="56" y2="36" stroke="#1a1a2a" stroke-width="1.2" opacity="0.7"/>
  <line x1="68" y1="10" x2="68" y2="34" stroke="#1a1a2a" stroke-width="1" opacity="0.6"/>
  <line x1="78" y1="10" x2="78" y2="34" stroke="#1a1a2a" stroke-width="0.8" opacity="0.5"/>
  <!-- Horizontal articulation -->
  <path d="M12 16 Q40 18 54 16" stroke="#1a1a2a" stroke-width="0.8" fill="none"/>
  <path d="M12 26 Q40 28 54 26" stroke="#1a1a2a" stroke-width="0.8" fill="none"/>
  <!-- Rivets -->
  <circle cx="16" cy="8" r="1.3" fill="#4a4a52" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="16" cy="20" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="16" cy="32" r="1.3" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.6"/>
  <circle cx="62" cy="14" r="1.2" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.5"/>
  <circle cx="62" cy="28" r="1.2" fill="#3a3a42" stroke="#0a0a0a" stroke-width="0.5"/>
  <!-- Sheen -->
  <path d="M46 4 Q54 6 54 14" stroke="#72727a" stroke-width="1.2" fill="none" opacity="0.35"/>
  <path d="M82 12 Q86 16 86 24" stroke="#72727a" stroke-width="1" fill="none" opacity="0.3"/>
  <!-- Shadow -->
  <rect x="10" y="2" width="20" height="38" rx="4" fill="#0a0a0a" opacity="0.15"/>
  <!-- Scratches -->
  <line x1="40" y1="8" x2="48" y2="18" stroke="#606068" stroke-width="0.5" opacity="0.4"/>
  <line x1="72" y1="16" x2="78" y2="26" stroke="#606068" stroke-width="0.5" opacity="0.35"/>
  <!-- Rust -->
  <circle cx="44" cy="32" r="1.5" fill="#6a3a20" opacity="0.25"/>
</svg>