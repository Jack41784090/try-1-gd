<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 144" width="56" height="144">
  <defs>
    <linearGradient id="rshin-shadow" x1="1" y1="0" x2="0" y2="0.2">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="rshin-hatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#0a0a0a" stroke-width="0.5" opacity="0.12"/>
    </pattern>
  </defs>
  <!-- Leather underneath -->
  <rect x="3" y="3" width="50" height="138" rx="8" fill="#4a3020" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Steel greave - front plate -->
  <path d="M6 8 Q28 2 50 8 L52 110 Q28 118 4 110 Z" fill="#3a3a42" stroke="#0a0a0a" stroke-width="2.5"/>
  <!-- Greave highlight -->
  <path d="M10 12 Q28 6 46 12 L46 40 Q28 44 10 40 Z" fill="#52525a" opacity="0.5"/>
  <!-- Center ridge -->
  <line x1="28" y1="10" x2="28" y2="108" stroke="#52525a" stroke-width="1.5" opacity="0.4"/>
  <!-- Plate segments -->
  <path d="M8 40 Q28 44 48 40" stroke="#0a0a0a" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M6 70 Q28 74 50 70" stroke="#0a0a0a" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M6 96 Q28 100 50 96" stroke="#0a0a0a" stroke-width="1" fill="none" opacity="0.3"/>
  <!-- Battle dent - right side -->
  <ellipse cx="38" cy="50" rx="7" ry="5" fill="#2a2a30" opacity="0.3"/>
  <path d="M32 48 Q38 54 44 48" stroke="#52525a" stroke-width="0.6" fill="none" opacity="0.5"/>
  <!-- Battle scratches -->
  <path d="M18 22 L40 26" stroke="#5a5a64" stroke-width="0.8" fill="none" opacity="0.5"/>
  <path d="M15 48 L38 52" stroke="#5a5a64" stroke-width="0.6" fill="none" opacity="0.45"/>
  <path d="M10 78 L32 82" stroke="#5a5a64" stroke-width="0.7" fill="none" opacity="0.4"/>
  <path d="M20 95 L44 98" stroke="#5a5a64" stroke-width="0.6" fill="none" opacity="0.4"/>
  <!-- Deep gouge -->
  <path d="M36 25 L24 80" stroke="#2a2a30" stroke-width="1.2" fill="none" opacity="0.3"/>
  <path d="M37 25 L25 80" stroke="#5a5a64" stroke-width="0.5" fill="none" opacity="0.25"/>
  <!-- Rivets -->
  <circle cx="10" cy="20" r="2.5" fill="#2a2a30" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="46" cy="20" r="2.5" fill="#2a2a30" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="10" cy="60" r="2.5" fill="#2a2a30" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="46" cy="60" r="2.5" fill="#2a2a30" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="10" cy="100" r="2.5" fill="#2a2a30" stroke="#0a0a0a" stroke-width="0.8"/>
  <circle cx="46" cy="100" r="2.5" fill="#2a2a30" stroke="#0a0a0a" stroke-width="0.8"/>
  <!-- Rivet highlights -->
  <circle cx="9" cy="19" r="0.8" fill="#6a6a74" opacity="0.4"/>
  <circle cx="45" cy="19" r="0.8" fill="#6a6a74" opacity="0.4"/>
  <!-- Leather at bottom -->
  <rect x="4" y="112" width="48" height="28" rx="6" fill="#4a3020" stroke="#0a0a0a" stroke-width="1.5"/>
  <path d="M10 118 Q28 116 46 118" stroke="#3a2518" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M12 126 Q28 124 44 126" stroke="#3a2518" stroke-width="0.7" fill="none" opacity="0.3"/>
  <!-- Shadow overlay -->
  <rect x="3" y="3" width="50" height="138" rx="8" fill="url(#rshin-shadow)"/>
  <!-- Cross-hatching -->
  <rect x="28" y="3" width="25" height="138" rx="8" fill="url(#rshin-hatch)"/>
</svg>
