<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 104" width="48" height="104">
  <defs>
    <linearGradient id="rfa-shadow" x1="1" y1="0" x2="0" y2="0.3">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="rfa-hatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#0a0a0a" stroke-width="0.5" opacity="0.12"/>
    </pattern>
  </defs>
  <!-- Forearm base - leather bracer -->
  <rect x="3" y="3" width="42" height="98" rx="8" fill="#4a3020" stroke="#0a0a0a" stroke-width="2.5"/>
  <!-- Upper leather section -->
  <rect x="5" y="5" width="38" height="40" rx="6" fill="#5c3d28"/>
  <!-- Leather grain -->
  <path d="M28 12 Q36 16 28 22" stroke="#3a2518" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M14 20 Q22 24 14 30" stroke="#3a2518" stroke-width="0.7" fill="none" opacity="0.3"/>
  <path d="M32 30 Q38 34 32 40" stroke="#3a2518" stroke-width="0.7" fill="none" opacity="0.3"/>
  <!-- Steel studs row 1 -->
  <circle cx="12" cy="18" r="2.5" fill="#3a3a42" stroke="#0a0a0a" stroke-width="1"/>
  <circle cx="24" cy="18" r="2.5" fill="#3a3a42" stroke="#0a0a0a" stroke-width="1"/>
  <circle cx="36" cy="18" r="2.5" fill="#3a3a42" stroke="#0a0a0a" stroke-width="1"/>
  <!-- Stud highlights -->
  <circle cx="11" cy="17" r="0.8" fill="#6a6a74" opacity="0.5"/>
  <circle cx="23" cy="17" r="0.8" fill="#6a6a74" opacity="0.5"/>
  <circle cx="35" cy="17" r="0.8" fill="#6a6a74" opacity="0.5"/>
  <!-- Steel studs row 2 -->
  <circle cx="12" cy="36" r="2.5" fill="#3a3a42" stroke="#0a0a0a" stroke-width="1"/>
  <circle cx="24" cy="36" r="2.5" fill="#3a3a42" stroke="#0a0a0a" stroke-width="1"/>
  <circle cx="36" cy="36" r="2.5" fill="#3a3a42" stroke="#0a0a0a" stroke-width="1"/>
  <!-- Strap -->
  <rect x="3" y="48" width="42" height="8" rx="2" fill="#3a2518" stroke="#0a0a0a" stroke-width="1"/>
  <path d="M8 52 L40 52" stroke="#2a1810" stroke-width="0.8" fill="none" stroke-dasharray="2,3" opacity="0.6"/>
  <!-- Lower bracer -->
  <rect x="5" y="58" width="38" height="24" rx="4" fill="#5c3d28"/>
  <!-- Metal wrist guard -->
  <rect x="3" y="82" width="42" height="19" rx="5" fill="#3a3a42" stroke="#0a0a0a" stroke-width="2"/>
  <rect x="6" y="84" width="36" height="8" rx="3" fill="#52525a" opacity="0.5"/>
  <!-- Wrist guard scratches -->
  <path d="M12 88 L30 87" stroke="#5a5a64" stroke-width="0.6" fill="none" opacity="0.5"/>
  <path d="M18 93 L38 91" stroke="#5a5a64" stroke-width="0.5" fill="none" opacity="0.4"/>
  <!-- Wrist guard rivet -->
  <circle cx="24" cy="90" r="2" fill="#2a2a30" stroke="#0a0a0a" stroke-width="0.8"/>
  <!-- Shadow overlay -->
  <rect x="3" y="3" width="42" height="98" rx="8" fill="url(#rfa-shadow)"/>
  <!-- Cross-hatching -->
  <rect x="24" y="3" width="21" height="98" rx="8" fill="url(#rfa-hatch)"/>
</svg>
