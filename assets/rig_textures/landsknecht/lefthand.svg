<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="lh-shadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="lh-hatch" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(135)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#0a0a0a" stroke-width="0.4" opacity="0.15"/>
    </pattern>
  </defs>
  <!-- Gauntlet base -->
  <circle cx="20" cy="20" r="17" fill="#4a3020" stroke="#0a0a0a" stroke-width="2.5"/>
  <!-- Leather inner -->
  <circle cx="20" cy="20" r="13" fill="#5c3d28"/>
  <!-- Steel knuckle guard -->
  <path d="M6 12 Q20 4 34 12 L32 20 Q20 14 8 20 Z" fill="#3a3a42" stroke="#0a0a0a" stroke-width="1.5"/>
  <path d="M8 13 Q20 7 32 13 L31 18 Q20 13 9 18 Z" fill="#52525a" opacity="0.5"/>
  <!-- Knuckle rivets -->
  <circle cx="14" cy="14" r="1.5" fill="#2a2a30" stroke="#0a0a0a" stroke-width="0.7"/>
  <circle cx="20" cy="12" r="1.5" fill="#2a2a30" stroke="#0a0a0a" stroke-width="0.7"/>
  <circle cx="26" cy="14" r="1.5" fill="#2a2a30" stroke="#0a0a0a" stroke-width="0.7"/>
  <!-- Finger segments -->
  <path d="M10 22 Q12 26 10 30" stroke="#3a2518" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M16 24 Q18 28 16 32" stroke="#3a2518" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M24 24 Q26 28 24 32" stroke="#3a2518" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M30 22 Q32 26 30 30" stroke="#3a2518" stroke-width="1" fill="none" opacity="0.5"/>
  <!-- Leather stitching -->
  <circle cx="20" cy="20" r="13" fill="none" stroke="#2a1810" stroke-width="0.6" stroke-dasharray="2,3" opacity="0.4"/>
  <!-- Shadow overlay -->
  <circle cx="20" cy="20" r="17" fill="url(#lh-shadow)"/>
  <!-- Cross-hatching -->
  <circle cx="20" cy="20" r="17" fill="url(#lh-hatch)"/>
</svg>
